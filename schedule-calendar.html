<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>Петровское СП — расписание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* ── Токены — в base.css (канон design-system.html) ────────────────── */

/* Вид: сегмент */
.view-tabs { padding: var(--space-2) var(--space-3) 0; }
.view-tabs .seg { width: 100%; }
@media (min-width: 560px) { .view-tabs { padding: var(--space-2) var(--space-6) 0; } }

/* Фильтры: горизонтальный скролл */
.chips {
  display: flex; gap: var(--space-2); overflow-x: auto;
  padding: var(--space-3) var(--space-3) 0;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 560px) { .chips { padding-left: var(--space-6); padding-right: var(--space-6); } }
.chips > .fchip { flex: none; }
.fchip .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--meta)); }
.fchip.is-on .dot { background: var(--accent-on); }

.filter-row { padding: var(--space-3) var(--space-3) var(--space-2); }
@media (min-width: 560px) { .filter-row { padding-left: var(--space-6); padding-right: var(--space-6); } }
.filter-btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: var(--h-sm); padding: 0 var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  background: var(--surface); color: var(--fg-2);
  font-family: inherit; font-size: var(--fs-meta); font-weight: 600;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.filter-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.filter-btn:active { transform: scale(0.98); }
.filter-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.filter-btn .f-ic { width: var(--icon-sm); height: var(--icon-sm); color: var(--accent); flex: none; }
.filter-btn .f-chev { width: 13px; height: 13px; color: var(--meta); flex: none; }
.filter-btn .f-hint { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-caption); font-weight: 500; color: var(--meta); }

/* Поиск: раскрытие под шапкой */
.search-wrap {
  overflow: hidden; max-height: 0; opacity: 0; transform: translateY(-6px);
  transition: max-height var(--motion-base) var(--ease-standard),
              opacity var(--motion-base) var(--ease-standard),
              transform var(--motion-base) var(--ease-standard);
}
.search-wrap.is-open { max-height: 84px; opacity: 1; transform: none; margin: var(--space-2) 0 var(--space-3); }
.search-clear {
  flex: none; width: 40px; height: 40px;
  border: 0; background: none; color: var(--meta);
  display: grid; place-items: center; cursor: pointer;
}
.search-clear svg { width: var(--icon-sm); height: var(--icon-sm); }
.search-clear:hover { color: var(--fg-2); }
.search-clear:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 50%; }

/* Календарь: кнопки навигации */
.cal-nav .icon-btn-sm { width: 36px; height: 36px; }
.cal-nav .prev svg { transform: rotate(180deg); }

/* День и карточки */
.day { margin-top: var(--space-8); }
.day-head { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-1) var(--space-3); }
.day-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-size: var(--fs-title); font-weight: 600; letter-spacing: var(--tracking-display); text-transform: uppercase; }
.sec-count { flex: none; font-family: var(--font-mono); font-size: var(--fs-caption); font-weight: 600; color: var(--meta); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); }
.cards { display: grid; gap: var(--space-3); }
.ev-card { animation: card-in 0.28s var(--ease-standard) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ev-card.is-link { cursor: pointer; transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard); }
.ev-card.is-link:hover { background: var(--surface-2); border-color: var(--border-strong); }
.ev-card.is-link:active { transform: scale(0.99); animation: none; }

/* План тренировок */
.plan-body { padding-top: var(--space-3); }
.plan-head { display: flex; align-items: flex-end; gap: var(--space-3); }
.plan-head-txt { flex: 1; min-width: 0; }
.plan-title { margin: 0; font-family: var(--font-display); font-size: var(--fs-title); font-weight: 600; letter-spacing: var(--tracking-display); text-transform: uppercase; }
.plan-sub { margin: var(--space-1) 0 0; font-size: var(--fs-meta); color: var(--meta); }
.plan-time { flex: none; width: 116px; }
.plan-time .input { height: var(--h-sm); font-size: var(--fs-meta); padding: 0 var(--space-3); }
.plan-days { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
.plan-day {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); text-align: left; cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.plan-day:hover { background: var(--surface-2); }
.plan-day:active { transform: scale(0.995); }
.plan-day:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.plan-day.is-empty { border-style: dashed; }
.plan-day-name { flex: none; width: 108px; font-size: var(--fs-meta); font-weight: 700; color: var(--fg-2); }
.plan-day-main { flex: 1; min-width: 0; }
.plan-day-line { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.plan-sport-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.plan-day-tpl { display: block; font-size: var(--fs-body); font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-day.is-empty .plan-day-tpl { color: var(--meta); font-weight: 500; }
.plan-day-time { display: block; margin-top: 2px; font-size: var(--fs-meta); color: var(--meta); }
.plan-day-chev { flex: none; color: var(--meta); display: grid; place-items: center; }
.plan-day-chev svg { width: var(--icon-sm); height: var(--icon-sm); }
.plan-actions { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
.plan-hint { margin: var(--space-3) var(--space-1) 0; font-size: var(--fs-meta); line-height: 1.5; color: var(--meta); }

/* Шторка выбора шаблона */
.plan-picker { display: grid; gap: var(--space-2); padding-top: 2px; }
.plan-pick-group { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) 2px 0; font-size: var(--fs-caption); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.plan-pick-row {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); text-align: left; cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.plan-pick-row:hover { background: var(--surface-2); }
.plan-pick-row:active { transform: scale(0.995); }
.plan-pick-row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.plan-pick-row.is-on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.plan-pick-main { flex: 1; min-width: 0; }
.plan-pick-name { display: block; font-size: var(--fs-body); font-weight: 600; color: var(--fg); }
.plan-pick-count { display: block; margin-top: 1px; font-size: var(--fs-meta); color: var(--meta); }
.plan-pick-check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong); color: transparent; display: grid; place-items: center; transition: all var(--motion-fast) var(--ease-standard); }
.plan-pick-row.is-on .plan-pick-check { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.plan-pick-check svg { width: 13px; height: 13px; }
.plan-coach-tag { display: inline-block; margin-left: var(--space-2); padding: 2px 7px; border-radius: var(--radius-pill); font-size: var(--fs-caption); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 1px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

/* Загрузка плана в календарь */
.load-preview { margin-top: var(--space-2); }
.load-note { font-size: var(--fs-meta); line-height: 1.5; color: var(--meta); padding: var(--space-1) var(--space-1) var(--space-2); }
.load-count { display: block; font-size: var(--fs-meta); font-weight: 600; color: var(--fg-2); padding: 0 var(--space-1) var(--space-2); }
.load-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-1); border-bottom: 1px solid var(--border-soft); font-size: var(--fs-meta); }
.load-row:last-child { border-bottom: 0; }
.lr-date { flex: none; width: 128px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lr-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--type-training); }
.lr-tpl { flex: 1; min-width: 0; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.load-row.is-skip .lr-dot { background: var(--meta); }
.load-row.is-skip .lr-tpl { color: var(--meta); font-weight: 500; text-decoration: line-through; }
.load-row.is-skip .lr-date { color: var(--meta); }

/* Статусы: переключатели */
.stat-list { padding-top: var(--space-1); }
.stat-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-1); }
.stat-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.stat-name { flex: 1; min-width: 0; font-size: var(--fs-body); font-weight: 500; color: var(--fg); }
.switch {
  flex: none; position: relative; width: 44px; height: 26px;
  border: 0; border-radius: var(--radius-pill);
  background: var(--border-strong); cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.switch.on { background: var(--accent); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(18, 33, 59, 0.3); transition: transform var(--motion-fast) var(--ease-standard); }
.switch.on .knob { transform: translateX(18px); }
.switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* Меню события: опасные действия */
.sheet-item.is-danger .sheet-ic { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.sheet-item.is-danger .sheet-il { color: var(--danger); }

/* FAB «добавить» */
.fab {
  position: fixed; right: 20px; bottom: calc(96px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border: 0; border-radius: 50%;
  background: var(--accent); color: var(--accent-on);
  display: grid; place-items: center; cursor: pointer; z-index: 20;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
  transition: transform var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.fab:hover { background: var(--accent-hover); }
.fab:active { transform: scale(0.94); background: var(--accent-active); }
.fab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.fab svg { width: 24px; height: 24px; }
</style>
</head>

<div class="app">
  <header class="hd" data-od-id="schedule-header">
    <div class="avatar" aria-hidden="true">И</div>
    <div class="hd-txt">
      <h1>Расписание</h1>
      <p class="sub">События, тренировки и план ГТО</p>
    </div>
    <div class="hd-acts">
      <button type="button" class="icon-btn" data-search-toggle aria-label="Поиск по расписанию"><svg aria-hidden="true"><use href="#ic-search"/></svg></button>
      <a class="icon-btn" href="notifications.html" aria-label="Уведомления"><svg aria-hidden="true"><use href="#ic-bell"/></svg><span class="notif" aria-hidden="true">3</span></a>
    </div>
  </header>

  <div class="view-tabs" data-od-id="view-tabs">
    <div class="seg" role="tablist" aria-label="Вид">
      <button type="button" class="seg-btn is-active" id="tab-cal" role="tab" aria-selected="true" data-od-id="view-cal">Календарь</button>
      <button type="button" class="seg-btn" id="tab-plan" role="tab" aria-selected="false" data-od-id="view-plan">План тренировок</button>
    </div>
  </div>

  <div class="chips" id="chips" data-od-id="filters"></div>
  <div class="chips" id="sport-chips" data-od-id="sport-filters" style="display:none"></div>
  <div class="filter-row">
    <button type="button" class="filter-btn" id="filter-open" data-od-id="status-filter-open" aria-haspopup="dialog" aria-expanded="false">
      <svg class="f-ic" aria-hidden="true"><use href="#ic-sliders"/></svg>
      <span>Статусы</span>
      <span class="f-hint" id="status-hint">Все</span>
      <svg class="f-chev" aria-hidden="true"><use href="#ic-chev-up"/></svg>
    </button>
  </div>

  <main class="body">
    <div class="search-wrap" id="search-wrap" data-od-id="schedule-search">

    bike:     { label: 'Велосипед', token: '--sport-bike' },

        cat.label.toLowerCase().indexOf(q) >= 0 ||
        (e.place || '').toLowerCase().indexOf(q) >= 0;
      var sportHit = state.sport === 'all' || (e.type === 'training' && sportOf(e) === state.sport);

      });
      box.appendChild(b);
    });

      b.style.setProperty('--c', 'var(' + (f.token || '--st-done') + ')');

    master.className = 'stat-row';
    master.innerHTML =
      '<span class="stat-dot" style="--c: var(--st-done)" aria-hidden="true"></span>' +
      '<span class="stat-name">Все</span>';
    var ms = document.createElement('button');
    ms.className = 'switch' + (allStatusesOn() ? ' on' : '');
    ms.type = 'button';
    ms.setAttribute('role', 'switch');
    ms.setAttribute('aria-checked', allStatusesOn() ? 'true' : 'false');
    ms.setAttribute('aria-label', 'Все статусы');
    ms.innerHTML = '<span class="knob"></span>';
    ms.addEventListener('click', function () {
      var on = !allStatusesOn();
      STATUS_ORDER.forEach(function (s) { state.statusOn[s] = on; });
      refreshViews();
    });
    master.appendChild(ms);
    box.appendChild(master);

    STATUS_ORDER.forEach(function (s) {
      var st = STATUSES[s];
      var row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML =
        '<span class="stat-dot" style="--c: var(' + st.token + ')" aria-hidden="true"></span>' +
        '<span class="stat-name">' + st.label + '</span>';
      var sw = document.createElement('button');
      sw.className = 'switch' + (state.statusOn[s] ? ' on' : '');
      sw.type = 'button';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', state.statusOn[s] ? 'true' : 'false');
      sw.setAttribute('aria-label', st.label);
      sw.innerHTML = '<span class="knob"></span>';
      (function (key) {
        sw.addEventListener('click', function () {
          state.statusOn[key] = !state.statusOn[key];
          refreshViews();
        });
      })(s);
      row.appendChild(sw);
      box.appendChild(row);
    });

    var hint = document.getElementById('status-hint');
    if (allStatusesOn()) hint.textContent = 'Все';
    else if (!anyStatusOn()) hint.textContent = 'Ничего не выбрано';
    else {
      var names = STATUS_ORDER.filter(function (s) { return state.statusOn[s]; })
        .map(function (s) { return STATUSES[s].label; });
      hint.textContent = names.join(', ');
    }
  }

  /* ── Календарь ───────────────────────────────────────────────────── */
  function dotKeys(evs) {
    var keys = [];
    function push(k) { if (keys.indexOf(k) < 0) keys.push(k); }
    evs.forEach(function (e) {
      if (e.type === 'training') push('sport:' + sportOf(e));
      else if (CATS[e.type]) push('type:' + e.type);
    });
    return keys;
  }
  function dotColor(k) {
    if (k.indexOf('sport:') === 0) {
      var sp = SPORTS[k.slice(6)] || SPORTS.general;
      return 'var(' + sp.token + ')';
    }
    return 'var(' + CATS[k.slice(5)].token + ')';
  }
  function renderCalendar() {
    var y = state.viewY, m = state.viewM;
    document.getElementById('cal-month').textContent = MONTHS[m] + ' ' + y;

    var weekBox = document.getElementById('week');
    weekBox.innerHTML = '';
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(function (w) {
      var d = document.createElement('div');
      d.className = 'cal-wd';
      d.textContent = w;
      weekBox.appendChild(d);
    });

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var offset = firstOffset(y, m);
    var dim = daysInMonth(y, m);
    var prevDim = daysInMonth(y, m === 0 ? 11 : m - 1);
    var prevY = m === 0 ? y - 1 : y;
    var prevM = m === 0 ? 11 : m - 1;
    var nextY = m === 11 ? y + 1 : y;
    var nextM = m === 11 ? 0 : m + 1;

    var total = Math.ceil((offset + dim) / 7) * 7;

    for (var i = 0; i < total; i++) {
      var cell = document.createElement('button');
      cell.className = 'cal-cell';
      cell.type = 'button';
      var isOther = i < offset || i >= offset + dim;
      var cy, cm, cd;
      if (isOther) {
        cy = i < offset ? prevY : nextY;
        cm = i < offset ? prevM : nextM;
        cd = i < offset ? prevDim - offset + i + 1 : i - offset - dim + 1;
        cell.classList.add('is-other');
      } else {
        cy = y; cm = m; cd = i - offset + 1;
      }

      var evs = visibleEvents(cy, cm, cd);
      var keys = dotKeys(evs);

      var num = document.createElement('span');
      num.className = 'cal-num';
      num.textContent = cd;
      cell.appendChild(num);

      var dots = document.createElement('span');
      dots.className = 'cal-dots';
      keys.slice(0, 3).forEach(function (k) {
        var dot = document.createElement('i');
        dot.className = 'cal-dot';
        dot.style.setProperty('--c', dotColor(k));
        dots.appendChild(dot);
      });
      cell.appendChild(dots);

      var isToday = cy === now.getFullYear() && cm === now.getMonth() && cd === now.getDate();
      var isSel = state.selected && state.selected.y === cy && state.selected.m === cm && state.selected.d === cd;
      if (isToday) cell.classList.add('is-today');
      if (isSel) cell.classList.add('is-sel');

      cell.addEventListener('click', (function (cy, cm, cd, isOther) {
        return function () {
          if (isOther) { state.viewY = cy; state.viewM = cm; }
          state.selected = { y: cy, m: cm, d: cd };
          renderCalendar();
          renderDay();
        };
      })(cy, cm, cd, isOther));

      grid.appendChild(cell);
    }
  }

  /* ── События дня ─────────────────────────────────────────────────── */
  function renderDay() {
    var title = document.getElementById('day-title');
    var count = document.getElementById('day-count');
    var list = document.getElementById('day-list');

    if (!state.selected) {
      title.textContent = 'Выберите день';
      count.textContent = '';
      list.innerHTML = '<div class="empty"><b>Выберите день</b><span>Нажмите на число в календаре — здесь появятся события</span></div>';
      return;
    }

    var y = state.selected.y, m = state.selected.m, d = state.selected.d;
    var date = new Date(y, m, d);
    var label = date.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    title.textContent = label.charAt(0).toUpperCase() + label.slice(1);

    var evs = visibleEvents(y, m, d);
    count.textContent = evs.length ? (evs.length === 1 ? '1 событие' : evs.length + ' события') : '';

    if (!evs.length) {
      var why = state.query.trim()
        ? 'По вашему запросу ничего не найдено'
        : (state.filter !== 'all' || !allStatusesOn() ? 'События скрыты текущими фильтрами' : 'В этот день ничего не запланировано');
      list.innerHTML = '<div class="empty"><b>Событий нет</b><span>' + why + '</span></div>';
      return;
    }

    list.innerHTML = '';
    evs.forEach(function (e, i) {
      var cat = CATS[e.type] || CATS.event;
      var status = STATUSES[e.status] || STATUSES.open;
      var row = document.createElement('div');
      row.className = 'ev-card is-link';
      row.style.setProperty('--c', 'var(' + cat.token + ')');
      row.style.setProperty('--i', i);
      row.setAttribute('data-od-id', 'ev-' + e.type);

      var fmts = '';
      if (e.type === 'training') {
        fmts = '<div class="ev-fmts"><span class="gchip" style="--c: var(--accent)">' + (e.fmt || 'Личная') + '</span></div>';
      } else if (e.type === 'gto') {
        fmts = '<div class="ev-fmts"><span class="gchip" style="--c: var(--sport-gto)">С тренером</span></div>';
      }

      var avatars = '';
      if (e.status !== 'open') {
        if (e.type === 'gto' || e.fmt === 'С тренером') {
          avatars = '<div class="ev-avatars"><span class="ev-ava is-coach" style="--c: var(--sport-gto)"><svg class="ev-coach-badge" aria-hidden="true"><use href="#ic-star"/></svg>Т</span></div>';
        } else {
          avatars = '<div class="ev-avatars"><span class="ev-ava is-you">И</span></div>';
        }
      }

      row.innerHTML =
        '<header class="ev-top">' +
          '<div class="ev-title-row"><h3 class="ev-title">' + e.title + '</h3></div>' +
          '<button type="button" class="ev-menu" aria-label="Меню события" aria-haspopup="dialog" aria-expanded="false"><svg aria-hidden="true"><use href="#ic-dots"/></svg></button>' +
          '<span class="ev-badge ev-badge-status' + (e.status === 'pending' ? ' is-pending' : '') + '" style="--c: var(' + status.token + ')"><i class="ev-bdot" aria-hidden="true"></i>' + status.label + '</span>' +
        '</header>' +
        fmts +
        '<p class="ev-meta"><b>' + e.time + '</b>' + (e.place ? ' · ' + e.place : '') + '</p>' +
        '<footer class="ev-foot">' +
          avatars +
          '<span class="ev-badge" style="--c: var(' + cat.token + ')">' + cat.label + '</span>' +
        '</footer>';

      var menuBtn = row.querySelector('.ev-menu');
      menuBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        renderMenu(e, menuBtn);
      });
      row.addEventListener('click', function () {
        if (e.to) location.href = e.to;
        else renderMenu(e);
      });
      list.appendChild(row);
    });
  }

  /* ── Вид: Календарь / План ───────────────────────────────────────── */
  var viewMode = 'cal';
  var DOW = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var DOW_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

  function setView(v) {
    viewMode = v;
    var isPlan = v === 'plan';
    document.getElementById('tab-cal').classList.toggle('is-active', !isPlan);
    document.getElementById('tab-plan').classList.toggle('is-active', isPlan);
    document.getElementById('tab-cal').setAttribute('aria-selected', isPlan ? 'false' : 'true');
    document.getElementById('tab-plan').setAttribute('aria-selected', isPlan ? 'true' : 'false');
    document.getElementById('plan-view').style.display = isPlan ? '' : 'none';
    document.getElementById('chips').style.display = isPlan ? 'none' : '';
    document.getElementById('sport-chips').style.display = isPlan ? 'none' : '';
    [].forEach.call(document.querySelectorAll('.filter-row, .cal, .day'), function (b) {
      b.style.display = isPlan ? 'none' : '';
    });
    if (isPlan) renderPlan(); else renderSportChips();
  }

  function planEntry(dow) {
    for (var i = 0; i < plan.days.length; i++) if (plan.days[i].dow === dow) return plan.days[i];
    return null;
  }
  function setPlanEntry(dow, tpl) {
    var e = planEntry(dow);
    if (e) {
      if (tpl) { e.tpl = tpl; } else { plan.days.splice(plan.days.indexOf(e), 1); }
    } else if (tpl) {
      plan.days.push({ dow: dow, tpl: tpl });
      plan.days.sort(function (a, b) { return a.dow - b.dow; });
    }
    savePlan();
  }

  function renderPlan() {
    var box = document.getElementById('plan-days');
    box.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var dow = i + 1;
      var e = planEntry(dow);
      var tpl = e && templateById(e.tpl);
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'plan-day' + (tpl ? '' : ' is-empty');
      row.setAttribute('data-od-id', 'plan-day-' + dow);
      row.innerHTML =
        '<span class="plan-day-name">' + DOW[i] + '</span>' +
        '<span class="plan-day-main">' +
          (tpl
            ? '<span class="plan-day-line"><i class="plan-sport-dot" style="background:' + sportToken(sportOf(tpl)) + '" aria-hidden="true"></i><span class="plan-day-tpl">' + tpl.name + '</span></span>' +
              '<span class="plan-day-time">' + plan.time + ' · ' + sportLabel(tpl) + '</span>'
            : '<span class="plan-day-tpl">Отдых</span>') +
        '</span>' +
        '<span class="plan-day-chev" aria-hidden="true"><svg><use href="#ic-chev"/></svg></span>';
      row.addEventListener('click', (function (d) { return function () { openPlanDaySheet(d); }; })(dow));
      box.appendChild(row);
    }

    var cnt = plan.days.filter(function (d) { return d.tpl; }).length;
    document.getElementById('plan-summary').textContent = cnt
      ? (cnt === 1 ? '1 тренировка в неделю' : cnt + ' тренировки в неделю')
      : 'План пуст — назначьте дни';
    document.getElementById('plan-load').disabled = !cnt;
    document.getElementById('plan-time').value = plan.time;
    document.getElementById('plan-remove').style.display =
      overlayEvents().some(function (x) { return x.plan; }) ? '' : 'none';
    document.getElementById('plan-hint').textContent =
      allTemplates().length > BUILTIN_TEMPLATES.length
        ? 'Шаблоны из «Моей тренировки» (создание события) подключены автоматически.'
        : 'Добавьте шаблоны в «Моей тренировке» — они появятся в выборе дня.';
  }

  /* ── Шиты: единый механизм ───────────────────────────────────────── */
  var scrim = document.getElementById('scrim');
  var statusSheet = document.getElementById('status-sheet');
  var planSheet = document.getElementById('plan-sheet');
  var loadSheet = document.getElementById('load-sheet');
  var menuSheet = document.getElementById('menu-sheet');
  var sheets = [statusSheet, planSheet, loadSheet, menuSheet];

  function openSheet(el) {
    closeSheet(false);
    el.classList.add('open');
    scrim.classList.add('open');
    document.body.classList.add('no-scroll');
  }
  function closeSheet(resetAria) {
    sheets.forEach(function (s) { s.classList.remove('open'); });
    scrim.classList.remove('open');
    document.body.classList.remove('no-scroll');
    [].forEach.call(document.querySelectorAll('.ev-menu[aria-expanded="true"]'), function (b) {
      b.setAttribute('aria-expanded', 'false');
    });
  }
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (searchWrap.classList.contains('is-open')) { closeSearch(); return; }
    closeSheet();
  });

  /* ── Поиск по расписанию ─────────────────────────────────────────── */
  var searchWrap = document.getElementById('search-wrap');
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  function openSearch() {
    if (searchWrap.classList.contains('is-open')) return;
    searchWrap.classList.add('is-open');
    setTimeout(function () { searchInput.focus(); }, 240);
  }
  function closeSearch() {
    if (!searchWrap.classList.contains('is-open') && !state.query) return;
    searchWrap.classList.remove('is-open');
    searchWrap.classList.remove('has-text');
    state.query = '';
    searchInput.value = '';
    refreshViews();
  }
  document.querySelector('[data-search-toggle]').addEventListener('click', function () {
    if (searchWrap.classList.contains('is-open')) closeSearch();
    else openSearch();
  });
  searchInput.addEventListener('input', function () {
    state.query = searchInput.value;
    refreshViews();
  });
  searchClear.addEventListener('click', function () {
    state.query = '';
    searchInput.value = '';
    refreshViews();
    searchInput.focus();
  });

  /* ── Шторка статусов ────────────────────────────────────────────── */
  document.getElementById('filter-open').addEventListener('click', function () {
    renderStatusSwitches();
    openSheet(statusSheet);
    this.setAttribute('aria-expanded', 'true');
  });
  document.getElementById('sheet-close').addEventListener('click', function () { closeSheet(); });
  document.getElementById('sheet-done').addEventListener('click', function () { closeSheet(); });

  /* ── Меню события ────────────────────────────────────────────────── */
  function menuFor(e) {
    var isTraining = e.type === 'training';
    var isClosed = e.status === 'done' || e.status === 'cancelled';
    var items = [];
    function push(icon, label, hint, fn, danger) {
      items.push({ icon: icon, label: label, hint: hint, fn: fn, danger: !!danger });
    }
    if (isClosed) {
      push('ic-check', e.status === 'cancelled' ? 'Событие отменено' : 'Событие завершено',
        'Действия недоступны', null, false);
      return items;
    }
    if (isTraining) {
      push('ic-edit', 'Редактировать', 'Название и место', function () { toast('Редактирование появится в деталях тренировки'); });
      push('ic-clock', 'Изменить время', null, function () { toast('Время меняется в деталях тренировки'); });
      push('ic-check', 'Начать тренировку', 'Если есть план', function () { location.href = 'training-active.html'; });
      push('ic-share', 'Поделиться', null, function () { toast('Ссылка скопирована'); });
      push('ic-scan', 'QR-код входа', null, function () { toast('QR-код — в сканере профиля'); });
      push('ic-trash', 'Отменить / Удалить', 'Доступно до начала', function () { toast('Тренировка отменена (демо)'); }, true);
      return items;
    }
    if (e.type === 'gto') {
      if (e.to) push('ic-target', 'Цель и нормативы', null, function () { location.href = e.to; });
      push('ic-share', 'Поделиться', null, function () { toast('Ссылка скопирована'); });
      push('ic-trash', 'Убрать из расписания', null, function () { toast('Убрано из расписания (демо)'); }, true);
      return items;
    }
    if (e.type === 'club') {
      if (e.status === 'open') push('ic-plus', 'Записаться', null, function () { toast('Запись отправлена'); });
      else push('ic-users', 'Кто идёт', null, function () { toast('Участники (демо)'); });
      push('ic-chat', 'Клубный чат', 'Чат в мини-приложении ВКонтакте', function () { toast('Чат клуба (демо)'); });
      push('ic-share', 'Поделиться', null, function () { toast('Ссылка скопирована'); });
      push('ic-trash', 'Покинуть клуб', null, function () { toast('Вы вышли из клуба (демо)'); }, true);
      return items;
    }
    if (e.status === 'open') push('ic-plus', 'Записаться', null, function () { toast('Запись отправлена'); });
    else push('ic-users', 'Кто идёт', null, function () { toast('Участники (демо)'); });
    push('ic-share', 'Поделиться', null, function () { toast('Ссылка скопирована'); });
    if (e.type === 'rental') push('ic-trash', 'Отменить бронь', 'Доступно до начала', function () { toast('Бронь отменена (демо)'); }, true);
    else push('ic-trash', 'Отменить участие', null, function () { toast('Участие отменено (демо)'); }, true);
    return items;
  }

  var menuTitle = document.getElementById('menu-title');
  var menuList = document.getElementById('menu-list');
  function renderMenu(e, menuBtn) {
    menuTitle.textContent = e.title;
    menuList.innerHTML = '';
    menuFor(e).forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sheet-item' + (it.danger ? ' is-danger' : '');
      b.innerHTML =
        '<span class="sheet-ic"><svg aria-hidden="true"><use href="#' + it.icon + '"/></svg></span>' +
        '<span class="sheet-it"><span class="sheet-il">' + it.label + '</span>' +
        (it.hint ? '<span class="sheet-ih">' + it.hint + '</span>' : '') +
        '</span>';
      b.addEventListener('click', function () {
        closeSheet();
        if (it.fn) it.fn();
      });
      menuList.appendChild(b);
    });
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
    openSheet(menuSheet);
  }
  document.getElementById('menu-close').addEventListener('click', function () { closeSheet(); });

  /* ── Добавить событие (FAB → create-event) ───────────────────────── */
  document.getElementById('add-open').addEventListener('click', function () {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    var base = state.selected || { y: state.viewY, m: state.viewM, d: 1 };
    var d = base.y + '-' + p(base.m + 1) + '-' + p(base.d);
    location.href = 'create-event.html?date=' + d;
  });

  /* ── Навигация по месяцам ───────────────────────────────────────── */
  document.getElementById('prev').addEventListener('click', function () {
    state.viewM--;
    if (state.viewM < 0) { state.viewM = 11; state.viewY--; }
    state.selected = null;
    renderCalendar();
    renderDay();
  });
  document.getElementById('next').addEventListener('click', function () {
    state.viewM++;
    if (state.viewM > 11) { state.viewM = 0; state.viewY++; }
    state.selected = null;
    renderCalendar();
    renderDay();
  });

  /* ── План: выбор дня ────────────────────────────────────────────── */
  var planEditDow = 1;
  function pickCount(n) {
    if (n === 1) return 'упражнение';
    if (n < 5) return 'упражнения';
    return 'упражнений';
  }
  function openPlanDaySheet(dow) {
    planEditDow = dow;
    document.getElementById('plan-sheet-title').textContent = DOW_FULL[dow - 1];
    var box = document.getElementById('plan-picker');
    box.innerHTML = '';
    addPlanPick(box, { id: '', name: 'Отдых', items: [] }, dow);
    SPORT_ORDER.forEach(function (sid) {
      var group = allTemplates().filter(function (t) { return sportOf(t) === sid; });
      if (!group.length) return;
      var h = document.createElement('div');
      h.className = 'plan-pick-group';
      h.innerHTML = '<i class="plan-sport-dot" style="background:' + sportToken(sid) + '" aria-hidden="true"></i>' + (SPORTS[sid] || SPORTS.general).label;
      box.appendChild(h);
      group.forEach(function (t) { addPlanPick(box, t, dow); });
    });
    openSheet(planSheet);
  }
  function addPlanPick(box, t, dow) {
    var cur = planEntry(dow);
    var sel = (cur ? cur.tpl : '') === t.id;
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'plan-pick-row' + (sel ? ' is-on' : '');
    row.setAttribute('data-od-id', 'plan-pick-' + (t.id || 'none'));
    row.innerHTML =
      '<span class="plan-pick-main">' +
        '<span class="plan-pick-name">' + t.name + '</span>' +
        (t.items && t.items.length
          ? '<span class="plan-pick-count">' + t.items.length + ' ' + pickCount(t.items.length) + '</span>'
          : '') +
      '</span>' +
      '<span class="plan-pick-check"><svg aria-hidden="true"><use href="#ic-check"/></svg></span>';
    if (t.coach) {
      row.querySelector('.plan-pick-name').insertAdjacentHTML('beforeend', '<span class="plan-coach-tag">от тренера</span>');
    }
    row.addEventListener('click', function () {
      setPlanEntry(planEditDow, t.id || null);
      closeSheet();
      renderPlan();
      toast(t.id ? 'День назначен: ' + t.name : 'День отдыха');
    });
    box.appendChild(row);
  }

  /* ── План: загрузка в календарь ─────────────────────────────────── */
  var loadWeeks = 4;
  function renderPeriodChips() {
    [].forEach.call(document.querySelectorAll('#load-period .fchip'), function (b) {
      b.classList.toggle('is-on', +b.getAttribute('data-w') === loadWeeks);
    });
  }
  function planDates() {
    var out = [];
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayDow = (today.getDay() + 6) % 7;
    plan.days.forEach(function (d) {
      if (!d.tpl) return;
      var tpl = templateById(d.tpl);
      if (!tpl) return;
      var idx = d.dow - 1;
      for (var w = 0; w < loadWeeks; w++) {
        var dt = new Date(today);
        dt.setDate(today.getDate() + ((idx - todayDow + 7) % 7) + w * 7);
        out.push({ y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate(), dowName: DOW[d.dow - 1], tpl: tpl });
      }
    });
    out.sort(function (a, b) { return (a.y - b.y) || (a.m - b.m) || (a.d - b.d); });
    return out;
  }
  function fmtDate(pd) {
    return pd.dowName + ' ' + pd.d + '.' + (pd.m < 9 ? '0' : '') + (pd.m + 1) + '.' + pd.y;
  }
  function hasPlanOn(pd) {
    return allEvents().some(function (e) { return e.y === pd.y && e.m === pd.m && e.d === pd.d && e.plan; });
  }
  function renderLoadPreview() {
    var dates = planDates();
    var box = document.getElementById('load-preview');
    var go = document.getElementById('load-go');
    if (!dates.length) {
      box.innerHTML = '<div class="load-note">План пуст — назначьте хотя бы один день.</div>';
      go.textContent = 'Добавить в календарь';
      go.setAttribute('disabled', '');
      return;
    }
    go.removeAttribute('disabled');
    var skipped = 0;
    var rows = [];
    dates.forEach(function (pd) {
      var skip = hasPlanOn(pd);
      if (skip) skipped++;
      rows.push(
        '<div class="load-row' + (skip ? ' is-skip' : '') + '">' +
        '<span class="lr-date">' + fmtDate(pd) + '</span>' +
        '<span class="lr-dot" aria-hidden="true"></span>' +
        '<span class="lr-tpl">' + pd.tpl.name + '</span>' +
        '</div>');
    });
    var added = dates.length - skipped;
    box.innerHTML =
      '<span class="load-count">' + added + ' к добавлению' +
        (skipped ? ' · ' + skipped + ' уже есть' : '') + ' · ' + loadWeeks + ' нед.</span>' +
      rows.join('');
    go.textContent = 'Добавить ' + added + ' в календарь';
  }
  function openLoadSheet() {
    renderPeriodChips();
    renderLoadPreview();
    openSheet(loadSheet);
  }
  function timeRange(t) {
    var q = t.split(':');
    var hh = (+q[0] + 1) % 24;
    return t + ' – ' + (hh < 10 ? '0' : '') + hh + ':' + q[1];
  }
  function doLoadPlan() {
    var dates = planDates();
    if (!dates.length) { closeSheet(); return; }
    var overlay = overlayEvents();
    var added = 0, skipped = 0, first = null;
    dates.forEach(function (pd) {
      if (hasPlanOn(pd)) { skipped++; return; }
      if (!first) first = pd;
      overlay.push({
        y: pd.y, m: pd.m, d: pd.d,
        type: 'training', title: pd.tpl.name,
        time: timeRange(plan.time),
        place: 'По плану',
        status: 'confirmed',
        plan: true,
        sport: sportOf(pd.tpl)
      });
      added++;
    });
    if (added) saveOverlayEvents(overlay);
    closeSheet();
    renderPlan();
    if (first) {
      state.viewY = first.y;
      state.viewM = first.m;
      state.selected = { y: first.y, m: first.m, d: first.d };
    }
    refreshViews();
    toast(added
      ? 'Добавлено ' + added + (skipped ? ', пропущено ' + skipped + ' (уже есть)' : '')
      : 'План уже весь в календаре');
  }
  function removePlanEvents() {
    saveOverlayEvents(overlayEvents().filter(function (e) { return !e.plan; }));
    renderPlan();
    refreshViews();
    toast('План убран из календаря');
  }

  document.getElementById('tab-cal').addEventListener('click', function () { setView('cal'); });
  document.getElementById('tab-plan').addEventListener('click', function () { setView('plan'); });
  document.getElementById('plan-load').addEventListener('click', openLoadSheet);
  document.getElementById('plan-remove').addEventListener('click', removePlanEvents);
  document.getElementById('plan-sheet-close').addEventListener('click', function () { closeSheet(); });
  document.getElementById('load-close').addEventListener('click', function () { closeSheet(); });
  document.getElementById('load-cancel').addEventListener('click', function () { closeSheet(); });
  document.getElementById('load-go').addEventListener('click', doLoadPlan);
  document.getElementById('load-period').addEventListener('click', function (ev) {
    var b = ev.target.closest('.fchip');
    if (!b) return;
    loadWeeks = +b.getAttribute('data-w');
    renderPeriodChips();
    renderLoadPreview();
  });
  document.getElementById('plan-time').addEventListener('change', function () {
    if (this.value) { plan.time = this.value; savePlan(); renderPlan(); }
  });

  renderChips();
  renderStatusSwitches();
  renderCalendar();
  renderDay();
})();
</script>
</body>
</html>
