<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<title>Петровское СП — расписание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Поверхности: небо / белый / карта ────────────────────────────── */
  --bg: #eaf4ff;
  --surface: #ffffff;
  --surface-2: #eef6ff;
  --surface-warm: #f5faff;

  /* ── Текст ─────────────────────────────────────────────────────── */
  --fg: #12213b;
  --fg-2: #445269;
  --muted: #78859b;
  --meta: #99a4b7;

  /* ── Границы ───────────────────────────────────────────────────── */
  --border: rgba(18,33,59,0.08);
  --border-soft: rgba(18,33,59,0.05);
  --border-strong: rgba(18,33,59,0.16);

  /* ── Акцент ─────────────────────────────────────────────────────── */
  --accent: #1a86e0;
  --accent-on: #ffffff;
  --accent-hover: #2f97f0;
  --accent-active: #1473c9;
  --yellow: #ffc93c;
  --yellow-on: #12213b;

  /* ── Семантика ─────────────────────────────────────────────────── */
  --success: #2bb066;
  --warn: #ffc93c;
  --danger: #ff4d4d;

  /* ── Типографика ───────────────────────────────────────────────── */
  --font-display: "Oswald", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --leading-body: 1.5;
  --tracking-display: 0.01em;
  --tracking-caps: 0.08em;

  /* ── Отступы ────────────────────────────────────────────────────── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 980px;

  --elev-raised: 0 16px 36px rgba(18,33,59,0.10);
  --focus-ring: 0 0 0 4px rgba(26,134,224,0.30);

  --motion-fast: 150ms;
  --motion-base: 220ms;
  --ease-standard: cubic-bezier(0.28,0,0.22,1);

  --container-max: 700px;
}

/* ── Типы событий ─────────────────────────────────────────────────── */
:root {
  --type-me: #2f9e54;
  --type-trainer: var(--yellow);
  --type-event: #0b3d91;
  --type-club: #7ec8ff;
  --type-rental: #4a6fa5;
  --type-gto: #c9a06b;
}
:root {
  --sport-run: #e8622c;
  --sport-swim: #1a8fd6;
  --sport-bike: #2f9e54;
  --sport-ofp: #9b5de5;
  --sport-strength: #d6485b;
  --sport-gto: #c9a06b;
  --sport-general: var(--type-me);
}
:root {
  --st-confirmed: var(--success);
  --st-pending: var(--yellow);
  --st-open: #0b3d91;
  --st-done: var(--meta);
  --st-cancelled: var(--danger);
}
:root {
  --gto-bronze: #c9a06b;
  --gto-silver: #a9b6c9;
  --gto-gold: var(--yellow);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface-warm);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; }
a { color: inherit; }

.app {
  position: relative;
  z-index: 1;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 0 calc(100px + env(safe-area-inset-bottom));
  min-height: 100vh;
}

/* ── Шапка ─────────────────────────────────────────────────────────── */
.hd {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 28px 12px 18px;
}
@media (min-width: 560px) { .hd { padding: 40px 24px 22px; } }
.avatar {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--accent-on);
  background: var(--accent);
}
.hd-txt { flex: 1; min-width: 0; }
.hd h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  line-height: 1.3;
  color: var(--fg);
}
.hd-sub { margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
.hd-acts { display: flex; gap: 8px; flex: none; }
.icon-btn {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg-2);
  cursor: pointer;
  text-decoration: none;
  transition: background var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.is-accent { background: var(--accent); color: var(--accent-on); }
.icon-btn.is-accent:hover { background: var(--accent-hover); }
.icon-btn.is-accent:active { background: var(--accent-active); }
.notif {
  position: absolute;
  z-index: 2;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  box-sizing: border-box;
  border-radius: var(--radius-pill);
  background: var(--danger);
  color: #fff;
  font-family: var(--font-body);
  font-size: 9px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}
.icon-btn .notif { top: 4px; right: 2px; }

/* ── Фильтры-чипсы ────────────────────────────────────────────────── */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 12px 10px;
}
@media (min-width: 560px) { .chips { padding: 0 24px 12px; } }
.chips::-webkit-scrollbar { display: none; }
.chip {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--fg-2);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.chip:hover { background: var(--surface-2); }
.chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.chip-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c);
  opacity: 0.45;
  transition: opacity var(--motion-fast) var(--ease-standard);
}
.chip.is-on {
  color: color-mix(in srgb, var(--c) 100%, var(--fg) 25%);
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
  border-color: color-mix(in srgb, var(--c) 45%, var(--border));
}
.chip.is-on .chip-dot { opacity: 1; }

/* ── Кнопка фильтра статусов ──────────────────────────────────────── */
.filter-row { display: flex; align-items: center; gap: 10px; padding: 0 12px 4px; }
@media (min-width: 560px) { .filter-row { padding: 0 24px 6px; } }
.filter-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--fg-2);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.filter-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.filter-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.filter-btn .f-ic { width: 16px; height: 16px; color: var(--accent); flex: none; }
.filter-btn .f-chev { width: 13px; height: 13px; color: var(--meta); flex: none; }
.filter-btn .f-hint {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--meta);
}

/* ── Тело ──────────────────────────────────────────────────────────── */
/* ── Поиск (раскрывающийся) ─────────────────────────────────────────── */
.search-wrap {
  max-height: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  overflow: hidden;
  transition:
    max-height var(--motion-base) var(--ease-standard),
    opacity var(--motion-fast) var(--ease-standard),
    visibility 0s linear var(--motion-base);
}
.search-wrap.is-open {
  max-height: 76px;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    max-height var(--motion-base) var(--ease-standard),
    opacity var(--motion-fast) var(--ease-standard),
    visibility 0s;
}
.searchbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 4px;
  padding: 0 12px;
  height: 40px;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.searchbar-ic { flex: none; width: 17px; height: 17px; color: var(--meta); }
.searchbar input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font-family: inherit;
  font-size: 15px;
  color: var(--fg);
  outline: none;
}
.searchbar input::placeholder { color: var(--meta); }
.searchbar input::-webkit-search-cancel-button { display: none; }
.searchbar-clear {
  flex: none;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--fg-2);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-fast) var(--ease-standard);
}
.searchbar-clear svg { width: 12px; height: 12px; }
.searchbar-clear:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.search-wrap.has-text .searchbar-clear { opacity: 1; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { .search-wrap { transition: none; } }

.body { padding: 4px 12px 0; }
@media (min-width: 560px) { .body { padding: 4px 24px 0; } }

/* ── Календарь ────────────────────────────────────────────────────── */
.cal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 10px 10px;
}
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 6px 10px;
}
.cal-month {
  margin: 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
}
.cal-nav { display: flex; gap: 6px; }
.nav-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-warm);
  color: var(--fg-2);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.nav-btn:hover { background: var(--surface-2); }
.nav-btn:active { background: var(--surface-2); }
.nav-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.nav-btn svg { width: 16px; height: 16px; }
.nav-btn.prev svg { transform: rotate(180deg); }

.cal-week,
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.cal-week { padding-bottom: 4px; }
.cal-grid { row-gap: 4px; }
.cal-wd {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--meta);
  padding: 6px 0;
}
.cal-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 44px;
  height: 44px;
  margin: 0 auto;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  transition: border-color var(--motion-fast) var(--ease-standard),
              background var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard),
              box-shadow var(--motion-fast) var(--ease-standard);
}
@media (max-width: 340px) { .cal-cell { width: 38px; height: 38px; } }
.cal-cell:hover { border-color: var(--border-strong); background: var(--surface-2); }
.cal-cell:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.cal-cell.is-other { opacity: 0.4; }
.cal-num {
  font-size: 15px;
  font-weight: 500;
  line-height: 1;
  padding: 0 2px;
}
.cal-cell.is-today {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--surface));
  color: var(--accent);
}
.cal-cell.is-today .cal-num { font-weight: 700; }
.cal-cell.is-sel {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, var(--surface));
}
.cal-cell.is-sel .cal-num { font-weight: 700; }
.cal-dots {
  display: flex;
  gap: 2px;
  height: 6px;
  align-items: center;
}
.cal-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--c);
}
.cal-cell.is-sel .cal-dot { background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }

/* ── События дня ──────────────────────────────────────────────────── */
.day { margin-top: 28px; }
.day-head { display: flex; align-items: center; gap: 12px; padding: 0 2px 14px; }
.day-head h2 {
  margin: 0;
  flex: 1;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
}
.sec-count {
  flex: none;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--meta);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 3px 9px;
  font-variant-numeric: tabular-nums;
}
.cards { display: grid; gap: 12px; }
.empty {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 26px 16px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.empty b { display: block; font-size: 15px; font-weight: 600; color: var(--fg-2); margin-bottom: 3px; }

.ev-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border-left: 3px solid var(--c, var(--border));
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  animation: rise 0.5s var(--ease-standard) both;
  animation-delay: calc(var(--i, 0) * 60ms);
}
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .ev-card { animation: none; } }
.ev-card.is-link { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ev-card.is-link:hover { background: var(--surface-2); }
.ev-main { flex: 1; min-width: 0; }
.ev-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--fg);
}
.ev-card.is-link .ev-title { color: var(--fg); }
.ev-meta { margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.ev-meta b { font-weight: 600; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.ev-badges { flex: none; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 44%; }
.ev-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
  border-radius: 7px;
  padding: 3px 8px;
}
.ev-badge .b-dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.ev-chev { flex: none; color: var(--meta); display: grid; place-items: center; }
.ev-chev svg { width: 16px; height: 16px; }

/* ── Шиты ──────────────────────────────────────────────────────────── */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  transition: opacity var(--motion-base) var(--ease-standard);
  z-index: 40;
  pointer-events: none;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%) translateY(105%);
  transition: transform var(--motion-base) var(--ease-standard);
  width: 100%;
  max-width: var(--container-max);
  background: var(--surface-warm);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  border: 1px solid var(--border);
  border-bottom: 0;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  z-index: 50;
}
.sheet.open { transform: translateX(-50%) translateY(0); }
@media (min-width: 560px) { .sheet { bottom: 24px; border-radius: var(--radius-lg); border-bottom: 1px solid var(--border); box-shadow: var(--elev-raised); } }
.sheet-grab { width: 40px; height: 5px; border-radius: var(--radius-pill); background: var(--border-strong); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 8px; }
.sheet-title {
  margin: 0;
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.sheet-close {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg-2);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.sheet-close:hover { background: var(--surface-2); }
.sheet-close:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sheet-close svg { width: 15px; height: 15px; }
.sheet-cancel {
  margin-top: 8px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--surface-2);
  color: var(--fg-2);
  font-size: 15px;
  font-weight: 600;
  padding: 13px;
  cursor: pointer;
}
.sheet-cancel:hover { background: var(--surface); }
.sheet-cancel:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sheet-primary {
  margin-top: 8px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: var(--accent-on);
  font-size: 15px;
  font-weight: 700;
  padding: 13px;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.sheet-primary:hover { background: var(--accent-hover); }
.sheet-primary:active { background: var(--accent-active); }
.sheet-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ── Шторка статусов ──────────────────────────────────────────────── */
.stat-list { display: flex; flex-direction: column; gap: 2px; }
.stat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 8px;
  border-radius: var(--radius-md);
}
.stat-row:hover { background: var(--surface-2); }
.stat-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.stat-name { flex: 1; font-size: 15px; font-weight: 500; color: var(--fg); }
.switch {
  position: relative;
  flex: none;
  width: 46px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: var(--border-strong);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.switch .knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;

  var SPORT_ORDER = ['run', 'swim', 'bike', 'ofp', 'strength', 'gto', 'general'];
  function sportOf(x) { return (x && x.sport) || 'general'; }
  function sportToken(sid) { var sp = SPORTS[sid] || SPORTS.general; return 'var(' + sp.token + ')'; }
  function sportLabel(x) { return (SPORTS[sportOf(x)] || SPORTS.general).label; }

  var BUILTIN_TEMPLATES = [
    { id: 'run30', sport: 'run',      name: 'Бег 30 мин',      coach: false, items: ['Бег 30 мин'] },
    { id: 'legs',  sport: 'strength', name: 'Силовая · ноги',  coach: false, items: ['Приседания 3×12', 'Выпады 3×10'] },
    { id: 'gto',   sport: 'gto',      name: 'ГТО · бег 100 м', coach: true,  items: ['Бег 100 м'] }
  ];
  function savedTemplates() {
    try { return JSON.parse(localStorage.getItem(TPL_KEY)) || []; } catch (e) { return []; }
  }
  function allTemplates() { return BUILTIN_TEMPLATES.concat(savedTemplates()); }
  function templateById(id) {
    var l = allTemplates();
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }

  function overlayEvents() {
    try { return JSON.parse(localStorage.getItem(EVT_KEY)) || []; } catch (e) { return []; }
  }
  function saveOverlayEvents(arr) { localStorage.setItem(EVT_KEY, JSON.stringify(arr)); }
  function allEvents() { return EVENTS.concat(overlayEvents()); }

  function loadPlan() {
    try { return JSON.parse(localStorage.getItem(PLAN_KEY)) || null; } catch (e) { return null; }
  }
  var plan = loadPlan() || {
    time: '19:00',
    days: [
      { dow: 1, tpl: 'run30' },
      { dow: 3, tpl: 'legs' },
      { dow: 5, tpl: 'run30' }
    ]
  };
  function savePlan() { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); }

  /* ── Тост ─────────────────────────────────────────────────────────── */
  function toast(msg) {
    var wrap = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.classList.add('hide');
      setTimeout(function () { t.remove(); }, 260);
    }, 2200);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-toast]');
    if (t) { toast(t.getAttribute('data-toast')); return; }
  });

  /* ── Данные ──────────────────────────────────────────────────────── */
  function eventsFor(y, m, d) {
    return allEvents().filter(function (e) { return e.y === y && e.m === m && e.d === d; });
  }
  function visibleEvents(y, m, d) {
    var q = state.query.trim().toLowerCase();
    return eventsFor(y, m, d).filter(function (e) {
      var hit = !q ||
        e.title.toLowerCase().indexOf(q) >= 0 ||
        (TYPES[e.type] && TYPES[e.type].label.toLowerCase().indexOf(q) >= 0) ||
        (e.place || '').toLowerCase().indexOf(q) >= 0;
      var sportHit = state.sport === 'all' || (e.type === 'me' && sportOf(e) === state.sport);
      return hit &&
        (state.filter === 'all' || e.type === state.filter) &&
        sportHit &&
        !!state.statusOn[e.status];
    });
  }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function firstOffset(y, m) { return (new Date(y, m, 1).getDay() + 6) % 7; }

  /* ── Фильтры ─────────────────────────────────────────────────────── */
  function allStatusesOn() {
    return STATUS_ORDER.every(function (s) { return !!state.statusOn[s]; });
  }
  function anyStatusOn() {
    return STATUS_ORDER.some(function (s) { return !!state.statusOn[s]; });
  }
  function refreshViews() {
    if (state.selected) {
      var evs = visibleEvents(state.selected.y, state.selected.m, state.selected.d);
      if (!evs.length) state.selected = null;
    }
    renderChips();
    renderSportChips();
    renderStatusSwitches();
    renderCalendar();
    renderDay();
  }
  function renderChips() {
    var box = document.getElementById('chips');
    box.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = document.createElement('button');
      b.className = 'chip' + (state.filter === f.id ? ' is-on' : '');
      b.style.setProperty('--c', 'var(' + f.token + ')');
      b.innerHTML = '<span class="chip-dot" aria-hidden="true"></span>' + f.label;
      b.addEventListener('click', function () {
        state.filter = f.id;
        refreshViews();
      });
      box.appendChild(b);
    });
  }
  function renderSportChips() {
    var box = document.getElementById('sport-chips');
    var visible = state.filter === 'all' || state.filter === 'me';
    box.style.display = visible ? '' : 'none';
    if (!visible) return;
    box.innerHTML = '';
    var list = [{ id: 'all', label: 'Любой спорт', token: null }];
    SPORT_ORDER.forEach(function (s) { list.push({ id: s, label: SPORTS[s].label, token: SPORTS[s].token }); });
    list.forEach(function (f) {
      var b = document.createElement('button');
      b.className = 'chip' + (state.sport === f.id ? ' is-on' : '');
      b.style.setProperty('--c', 'var(' + (f.token || '--st-done') + ')');
      b.innerHTML = '<span class="chip-dot" aria-hidden="true"></span>' + f.label;
      b.addEventListener('click', function () {
        state.sport = f.id;
        refreshViews();
      });
      box.appendChild(b);
    });
  }
  function renderStatusSwitches() {
    var box = document.getElementById('status-list');
    box.innerHTML = '';
    var master = document.createElement('div');
    master.className = 'stat-row';
    master.innerHTML =
      '<span class="stat-dot" style="--c: var(--st-done)" aria-hidden="true"></span>' +
      '<span class="stat-name">Все</span>';
    var ms = document.createElement('button');
    ms.className = 'switch' + (allStatusesOn() ? ' on' : '');
    ms.setAttribute('role', 'switch');
    ms.setAttribute('aria-checked', allStatusesOn() ? 'true' : 'false');
    ms.setAttribute('aria-label', 'Все статусы');
    ms.innerHTML = '<span class="knob"></span>';
    ms.addEventListener('click', function () {
      var on = !allStatusesOn();
      STATUS_ORDER.forEach(function (s) { state.statusOn[s] = on; });
      refreshViews();
    });
    master.appendChild(ms);
    box.appendChild(master);

    STATUS_ORDER.forEach(function (s) {
      var st = STATUSES[s];
      var row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML =
        '<span class="stat-dot" style="--c: var(' + st.token + ')" aria-hidden="true"></span>' +
        '<span class="stat-name">' + st.label + '</span>';
      var sw = document.createElement('button');
      sw.className = 'switch' + (state.statusOn[s] ? ' on' : '');
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', state.statusOn[s] ? 'true' : 'false');
      sw.setAttribute('aria-label', st.label);
      sw.innerHTML = '<span class="knob"></span>';
      (function (key) {
        sw.addEventListener('click', function () {
          state.statusOn[key] = !state.statusOn[key];
          refreshViews();
        });
      })(s);
      row.appendChild(sw);
      box.appendChild(row);
    });

    var hint = document.getElementById('status-hint');
    if (allStatusesOn()) hint.textContent = 'Все';
    else if (!anyStatusOn()) hint.textContent = 'Ничего не выбрано';
    else {
      var names = STATUS_ORDER.filter(function (s) { return state.statusOn[s]; })
        .map(function (s) { return STATUSES[s].label; });
      hint.textContent = names.join(', ');
    }
  }

  /* ── Календарь ───────────────────────────────────────────────────── */
  function dotKeys(evs) {
    var keys = [];
    function push(k) { if (keys.indexOf(k) < 0) keys.push(k); }
    evs.forEach(function (e) {
      if (e.type === 'me') push('sport:' + sportOf(e));
      else if (TYPES[e.type]) push('type:' + e.type);
    });
    return keys;
  }
  function dotColor(k) {
    if (k.indexOf('sport:') === 0) {
      var sp = SPORTS[k.slice(6)] || SPORTS.general;
      return 'var(' + sp.token + ')';
    }
    return 'var(' + TYPES[k.slice(5)].token + ')';
  }
  function renderCalendar() {
    var y = state.viewY, m = state.viewM;
    document.getElementById('cal-month').textContent = MONTHS[m] + ' ' + y;

    var weekBox = document.getElementById('week');
    weekBox.innerHTML = '';
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(function (w) {
      var d = document.createElement('div');
      d.className = 'cal-wd';
      d.textContent = w;
      weekBox.appendChild(d);
    });

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var offset = firstOffset(y, m);
    var dim = daysInMonth(y, m);
    var prevDim = daysInMonth(y, m === 0 ? 11 : m - 1);
    var prevY = m === 0 ? y - 1 : y;
    var prevM = m === 0 ? 11 : m - 1;
    var nextY = m === 11 ? y + 1 : y;
    var nextM = m === 11 ? 0 : m + 1;

    var total = Math.ceil((offset + dim) / 7) * 7;

    for (var i = 0; i < total; i++) {
      var cell = document.createElement('button');
      cell.className = 'cal-cell';
      cell.type = 'button';
      var isOther = i < offset || i >= offset + dim;
      var cy, cm, cd;
      if (isOther) {
        cy = i < offset ? prevY : nextY;
        cm = i < offset ? prevM : nextM;
        cd = i < offset ? prevDim - offset + i + 1 : i - offset - dim + 1;
        cell.classList.add('is-other');
      } else {
        cy = y; cm = m; cd = i - offset + 1;
      }

      var evs = visibleEvents(cy, cm, cd);
      var keys = dotKeys(evs);

      var num = document.createElement('span');
      num.className = 'cal-num';
      num.textContent = cd;
      cell.appendChild(num);

      if (keys.length) {
        var dots = document.createElement('span');
        dots.className = 'cal-dots';
        keys.slice(0, 3).forEach(function (k) {
          var dot = document.createElement('i');
          dot.className = 'cal-dot';
          dot.style.setProperty('--c', dotColor(k));
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      } else {
        var pad = document.createElement('span');
        pad.className = 'cal-dots';
        cell.appendChild(pad);
      }

      var isToday = cy === now.getFullYear() && cm === now.getMonth() && cd === now.getDate();
      var isSel = state.selected && state.selected.y === cy && state.selected.m === cm && state.selected.d === cd;
      if (isToday) cell.classList.add('is-today');
      if (isSel) cell.classList.add('is-sel');

      cell.addEventListener('click', (function (cy, cm, cd, isOther) {
        return function () {
          if (isOther) { state.viewY = cy; state.viewM = cm; }
          state.selected = { y: cy, m: cm, d: cd };
          renderCalendar();
          renderDay();
        };
      })(cy, cm, cd, isOther));

      grid.appendChild(cell);
    }
  }

  /* ── События дня ─────────────────────────────────────────────────── */
  function renderDay() {
    var title = document.getElementById('day-title');
    var count = document.getElementById('day-count');
    var list = document.getElementById('day-list');

    if (!state.selected) {
      title.textContent = 'Выберите день';
      count.textContent = '';
      list.innerHTML = '<div class="empty"><b>Выберите день</b>Нажмите на число в календаре — здесь появятся события</div>';
      return;
    }

    var y = state.selected.y, m = state.selected.m, d = state.selected.d;
    var date = new Date(y, m, d);
    var label = date.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    title.textContent = label.charAt(0).toUpperCase() + label.slice(1);

    var evs = visibleEvents(y, m, d);
    count.textContent = evs.length ? (evs.length === 1 ? '1 событие' : evs.length + ' события') : '';

    if (!evs.length) {
      var why = state.query.trim()
        ? 'По вашему запросу ничего не найдено'
        : (state.filter !== 'all' || !allStatusesOn() ? 'События скрыты текущими фильтрами' : 'В этот день ничего не запланировано');
      list.innerHTML = '<div class="empty"><b>Событий нет</b>' + why + '</div>';
      return;
    }

    list.innerHTML = '';
    evs.forEach(function (e, i) {
      var type = TYPES[e.type];
      var status = STATUSES[e.status];
      var row = document.createElement('div');
      row.className = 'ev-card' + (e.to ? ' is-link' : '');
      row.style.setProperty('--c', 'var(' + type.token + ')');
      row.style.setProperty('--i', i);
      if (e.to) row.setAttribute('data-od-id', 'ev-' + e.type);
      row.innerHTML =
        '<div class="ev-main">' +
          '<h3 class="ev-title">' + e.title + '</h3>' +
          '<p class="ev-meta">' + e.time + ' · ' + e.place + '</p>' +
        '</div>' +
        '<div class="ev-badges">' +
          (e.type === 'me'
            ? '<span class="ev-badge" style="--c: var(--sport-' + sportOf(e) + ')"><i class="b-dot"></i>' + sportLabel(e) + '</span>'
            : '<span class="ev-badge" style="--c: var(' + type.token + ')">' + type.label + '</span>') +
          (e.status === 'open'
            ? ''
            : '<span class="ev-badge" style="--c: var(' + status.token + ')"><i class="b-dot"></i>' + status.label + '</span>') +
          (e.plan ? '<span class="ev-badge" style="--c: var(--accent)">План</span>' : '') +
        '</div>' +
        (e.to
          ? '<span class="ev-chev" aria-hidden="true"><svg><use href="#ic-chev"/></svg></span>'
          : '');
      if (e.to) {
        row.addEventListener('click', function () { location.href = e.to; });
      }
      list.appendChild(row);
    });
  }

  /* ── Вид: Календарь / План ───────────────────────────────────────── */
  var viewMode = 'cal';
  var DOW = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var DOW_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

  function setView(v) {
    viewMode = v;
    var isPlan = v === 'plan';
    document.getElementById('tab-cal').classList.toggle('is-on', !isPlan);
    document.getElementById('tab-plan').classList.toggle('is-on', isPlan);
    document.getElementById('tab-cal').setAttribute('aria-selected', isPlan ? 'false' : 'true');
    document.getElementById('tab-plan').setAttribute('aria-selected', isPlan ? 'true' : 'false');
    document.getElementById('plan-view').style.display = isPlan ? '' : 'none';
    document.getElementById('chips').style.display = isPlan ? 'none' : '';
    document.getElementById('sport-chips').style.display = isPlan ? 'none' : '';
    [].forEach.call(document.querySelectorAll('.filter-row, .cal, .day'), function (b) {
      b.style.display = isPlan ? 'none' : '';
    });
    if (isPlan) renderPlan(); else renderSportChips();
  }

  function planEntry(dow) {
    for (var i = 0; i < plan.days.length; i++) if (plan.days[i].dow === dow) return plan.days[i];
    return null;
  }
  function setPlanEntry(dow, tpl) {
    var e = planEntry(dow);
    if (e) {
      if (tpl) { e.tpl = tpl; } else { plan.days.splice(plan.days.indexOf(e), 1); }
    } else if (tpl) {
      plan.days.push({ dow: dow, tpl: tpl });
      plan.days.sort(function (a, b) { return a.dow - b.dow; });
    }
    savePlan();
  }

  function renderPlan() {
    var box = document.getElementById('plan-days');
    box.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var dow = i + 1;
      var e = planEntry(dow);
      var tpl = e && templateById(e.tpl);
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'plan-day' + (tpl ? '' : ' is-empty');
      row.setAttribute('data-od-id', 'plan-day-' + dow);
      row.innerHTML =
        '<span class="plan-day-name">' + DOW[i] + '</span>' +
        '<span class="plan-day-main">' +
          (tpl
            ? '<span class="plan-day-line"><i class="plan-sport-dot" style="background:' + sportToken(sportOf(tpl)) + '" aria-hidden="true"></i><span class="plan-day-tpl">' + tpl.name + '</span></span>' +
              '<span class="plan-day-time">' + plan.time + ' · ' + sportLabel(tpl) + '</span>'
            : '<span class="plan-day-tpl">Отдых</span>') +
        '</span>' +
        '<span class="plan-day-chev" aria-hidden="true"><svg><use href="#ic-chev"/></svg></span>';
      row.addEventListener('click', (function (d) { return function () { openPlanDaySheet(d); }; })(dow));
      box.appendChild(row);
    }

    var cnt = plan.days.filter(function (d) { return d.tpl; }).length;
    document.getElementById('plan-summary').textContent = cnt
      ? (cnt === 1 ? '1 тренировка в неделю' : cnt + ' тренировки в неделю')
      : 'План пуст — назначьте дни';
    document.getElementById('plan-load').disabled = !cnt;
    document.getElementById('plan-time').value = plan.time;
    document.getElementById('plan-remove').style.display =
      overlayEvents().some(function (x) { return x.plan; }) ? '' : 'none';
    document.getElementById('plan-hint').textContent =
      allTemplates().length > BUILTIN_TEMPLATES.length
        ? 'Шаблоны из «Моей тренировки» (создание события) подключены автоматически.'
        : 'Добавьте шаблоны в «Моей тренировке» — они появятся в выборе дня.';
  }

  /* ── Шиты: единый механизм ───────────────────────────────────────── */
  var scrim = document.getElementById('scrim');
  var statusSheet = document.getElementById('status-sheet');
  var addSheet = document.getElementById('add-sheet');
  var planSheet = document.getElementById('plan-sheet');
  var loadSheet = document.getElementById('load-sheet');
  var sheets = [statusSheet, addSheet, planSheet, loadSheet];

  function openSheet(el) {
    closeSheet();
    el.classList.add('open');
    scrim.classList.add('open');
    document.body.classList.add('no-scroll');
    document.getElementById('filter-open').setAttribute('aria-expanded', 'false');
  }
  function closeSheet() {
    sheets.forEach(function (s) { s.classList.remove('open'); });
    scrim.classList.remove('open');
    document.body.classList.remove('no-scroll');
    document.getElementById('filter-open').setAttribute('aria-expanded', 'false');
  }
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (searchWrap.classList.contains('is-open')) { closeSearch(); return; }
    closeSheet();
  });

  /* ── Поиск по расписанию ─────────────────────────────────────────── */
  var searchWrap = document.getElementById('search-wrap');
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  function openSearch() {
    if (searchWrap.classList.contains('is-open')) return;
    searchWrap.classList.add('is-open');
    setTimeout(function () { searchInput.focus(); }, 240);
  }
  function closeSearch() {
    if (!searchWrap.classList.contains('is-open') && !state.query) return;
    searchWrap.classList.remove('is-open');
    searchWrap.classList.remove('has-text');
    state.query = '';
    searchInput.value = '';
    refreshViews();
  }
  document.querySelector('[data-search-toggle]').addEventListener('click', function () {
    if (searchWrap.classList.contains('is-open')) closeSearch();
    else openSearch();
  });
  searchInput.addEventListener('input', function () {
    state.query = searchInput.value;
    searchWrap.classList.toggle('has-text', !!state.query.trim());
    refreshViews();
  });
  searchClear.addEventListener('click', function () {
    state.query = '';
    searchInput.value = '';
    searchWrap.classList.remove('has-text');
    refreshViews();
    searchInput.focus();
  });

  /* ── Шторка статусов ────────────────────────────────────────────── */
  document.getElementById('filter-open').addEventListener('click', function () {
    renderStatusSwitches();
    openSheet(statusSheet);
    this.setAttribute('aria-expanded', 'true');
  });
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('sheet-done').addEventListener('click', closeSheet);

  /* ── Форма создания события ─────────────────────────────────────── */
  var addType = 'me';
  var addStatus = 'confirmed';

  function renderAddPickers() {
    var tb = document.getElementById('add-types');
    tb.innerHTML = '';
    TYPE_ORDER.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'add-type' + (addType === t ? ' is-on' : '');

      b.innerHTML = '<span class="t-dot" aria-hidden="true"></span>' + TYPES[t].label;
      b.addEventListener('click', function () { addType = t; renderAddPickers(); });
      tb.appendChild(b);
    });
    var sb = document.getElementById('add-statuses');
    sb.innerHTML = '';
    STATUS_ORDER.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'add-status' + (addStatus === s ? ' is-on' : '');
      b.style.setProperty('--c', 'var(' + STATUSES[s].token + ')');
      b.innerHTML = '<span class="s-dot" aria-hidden="true"></span>' + STATUSES[s].label;
      b.addEventListener('click', function () { addStatus = s; renderAddPickers(); });
      sb.appendChild(b);
    });
  }

  function defaultAddDate() {
    var base = state.selected || { y: state.viewY, m: state.viewM, d: 1 };
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return base.y + '-' + p(base.m + 1) + '-' + p(base.d);
  }

  function openAddSheet() {
    addType = 'me';
    addStatus = 'confirmed';
    renderAddPickers();
    document.getElementById('add-title').value = '';
    document.getElementById('add-date').value = defaultAddDate();
    document.getElementById('add-time').value = '';
    document.getElementById('add-place').value = '';
    openSheet(addSheet);
    document.getElementById('add-title').focus();
  }
  document.getElementById('add-open').addEventListener('click', function () {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    var base = state.selected || { y: state.viewY, m: state.viewM, d: 1 };
    var d = base.y + '-' + p(base.m + 1) + '-' + p(base.d);
    location.href = 'create-event.html?date=' + d;
  });
  document.getElementById('add-close').addEventListener('click', closeSheet);
  document.getElementById('add-cancel').addEventListener('click', closeSheet);

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = document.getElementById('add-title').value.trim();
    var dateVal = document.getElementById('add-date').value;
    var time = document.getElementById('add-time').value.trim();
    var place = document.getElementById('add-place').value.trim();
    if (!title) { toast('Введите название события'); return; }
    if (!dateVal) { toast('Укажите дату'); return; }
    var parts = dateVal.split('-');
    var ev = {
      y: +parts[0], m: +parts[1] - 1, d: +parts[2],
      type: addType, title: title,
      time: time || 'Время уточняется', place: place || 'Место уточняется',
      status: addStatus
    };
    if (addType === 'me') ev.sport = 'general';
    var overlay = overlayEvents();
    overlay.push(ev);
    saveOverlayEvents(overlay);
    state.viewY = ev.y;
    state.viewM = ev.m;
    state.selected = { y: ev.y, m: ev.m, d: ev.d };
    closeSheet();
    refreshViews();
    toast('Событие добавлено');
  });

  /* ── Навигация по месяцам ───────────────────────────────────────── */
  document.getElementById('prev').addEventListener('click', function () {
    state.viewM--;
    if (state.viewM < 0) { state.viewM = 11; state.viewY--; }
    state.selected = null;
    renderCalendar();
    renderDay();
  });
  document.getElementById('next').addEventListener('click', function () {
    state.viewM++;
    if (state.viewM > 11) { state.viewM = 0; state.viewY++; }
    state.selected = null;
    renderCalendar();
    renderDay();
  });

  /* ── План: выбор дня ────────────────────────────────────────────── */
  var planEditDow = 1;
  function pickCount(n) {
    if (n === 1) return 'упражнение';
    if (n < 5) return 'упражнения';
    return 'упражнений';
  }
  function openPlanDaySheet(dow) {
    planEditDow = dow;
    document.getElementById('plan-sheet-title').textContent = DOW_FULL[dow - 1];
    var box = document.getElementById('plan-picker');
    box.innerHTML = '';
    addPlanPick(box, { id: '', name: 'Отдых', items: [] }, dow);
    SPORT_ORDER.forEach(function (sid) {
      var group = allTemplates().filter(function (t) { return sportOf(t) === sid; });
      if (!group.length) return;
      var h = document.createElement('div');
      h.className = 'plan-pick-group';
      h.innerHTML = '<i class="plan-sport-dot" style="background:' + sportToken(sid) + '" aria-hidden="true"></i>' + (SPORTS[sid] || SPORTS.general).label;
      box.appendChild(h);
      group.forEach(function (t) { addPlanPick(box, t, dow); });
    });
    openSheet(planSheet);
  }
  function addPlanPick(box, t, dow) {
    var cur = planEntry(dow);
    var sel = (cur ? cur.tpl : '') === t.id;
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'plan-pick-row' + (sel ? ' is-on' : '');
    row.setAttribute('data-od-id', 'plan-pick-' + (t.id || 'none'));
    row.innerHTML =
      '<span class="plan-pick-main">' +
        '<span class="plan-pick-name">' + t.name + '</span>' +
        (t.items && t.items.length
          ? '<span class="plan-pick-count">' + t.items.length + ' ' + pickCount(t.items.length) + '</span>'
          : '') +
      '</span>' +
      '<span class="plan-pick-check"><svg aria-hidden="true"><use href="#ic-check"/></svg></span>';
    if (t.coach) {
      row.querySelector('.plan-pick-name').insertAdjacentHTML('beforeend', '<span class="plan-coach-tag">от тренера</span>');
    }
    row.addEventListener('click', function () {
      setPlanEntry(planEditDow, t.id || null);
      closeSheet();
      renderPlan();
      toast(t.id ? 'День назначен: ' + t.name : 'День отдыха');
    });
    box.appendChild(row);
  }

  /* ── План: загрузка в календарь ─────────────────────────────────── */
  var loadWeeks = 4;
  function renderPeriodChips() {
    [].forEach.call(document.querySelectorAll('#load-period .chip'), function (b) {
      b.classList.toggle('is-on', +b.getAttribute('data-w') === loadWeeks);
    });
  }
  function planDates() {
    var out = [];
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayDow = (today.getDay() + 6) % 7;
    plan.days.forEach(function (d) {
      if (!d.tpl) return;
      var tpl = templateById(d.tpl);
      if (!tpl) return;
      var idx = d.dow - 1;
      for (var w = 0; w < loadWeeks; w++) {
        var dt = new Date(today);
        dt.setDate(today.getDate() + ((idx - todayDow + 7) % 7) + w * 7);
        out.push({ y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate(), dowName: DOW[d.dow - 1], tpl: tpl });
      }
    });
    out.sort(function (a, b) { return (a.y - b.y) || (a.m - b.m) || (a.d - b.d); });
    return out;
  }
  function fmtDate(pd) {
    return pd.dowName + ' ' + pd.d + '.' + (pd.m < 9 ? '0' : '') + (pd.m + 1) + '.' + pd.y;
  }
  function hasPlanOn(pd) {
    return allEvents().some(function (e) { return e.y === pd.y && e.m === pd.m && e.d === pd.d && e.plan; });
  }
  function renderLoadPreview() {
    var dates = planDates();
    var box = document.getElementById('load-preview');
    var go = document.getElementById('load-go');
    if (!dates.length) {
      box.innerHTML = '<div class="load-note">План пуст — назначьте хотя бы один день.</div>';
      go.textContent = 'Добавить в календарь';
      go.setAttribute('disabled', '');
      return;
    }
    go.removeAttribute('disabled');
    var skipped = 0;
    var rows = [];
    dates.forEach(function (pd) {
      var skip = hasPlanOn(pd);
      if (skip) skipped++;
      rows.push(
        '<div class="load-row' + (skip ? ' is-skip' : '') + '">' +
        '<span class="lr-date">' + fmtDate(pd) + '</span>' +
        '<span class="lr-dot" aria-hidden="true"></span>' +
        '<span class="lr-tpl">' + pd.tpl.name + '</span>' +
        '</div>');
    });
    var added = dates.length - skipped;
    box.innerHTML =
      '<span class="load-count">' + added + ' к добавлению' +
        (skipped ? ' · ' + skipped + ' уже есть' : '') + ' · ' + loadWeeks + ' нед.</span>' +
      rows.join('');
    go.textContent = 'Добавить ' + added + ' в календарь';
  }
  function openLoadSheet() {
    renderPeriodChips();
    renderLoadPreview();
    openSheet(loadSheet);
  }
  function timeRange(t) {
    var q = t.split(':');
    var hh = (+q[0] + 1) % 24;
    return t + ' – ' + (hh < 10 ? '0' : '') + hh + ':' + q[1];
  }
  function doLoadPlan() {
    var dates = planDates();
    if (!dates.length) { closeSheet(); return; }
    var overlay = overlayEvents();
    var added = 0, skipped = 0, first = null;
    dates.forEach(function (pd) {
      if (hasPlanOn(pd)) { skipped++; return; }
      if (!first) first = pd;
      overlay.push({
        y: pd.y, m: pd.m, d: pd.d,
        type: 'me', title: pd.tpl.name,
        time: timeRange(plan.time),
        place: 'По плану',
        status: 'confirmed',
        plan: true,
        sport: sportOf(pd.tpl)
      });
      added++;
    });
    if (added) saveOverlayEvents(overlay);
    closeSheet();
    renderPlan();
    if (first) {
      state.viewY = first.y;
      state.viewM = first.m;
      state.selected = { y: first.y, m: first.m, d: first.d };
    }
    refreshViews();
    toast(added
      ? 'Добавлено ' + added + (skipped ? ', пропущено ' + skipped + ' (уже есть)' : '')
      : 'План уже весь в календаре');
  }
  function removePlanEvents() {
    saveOverlayEvents(overlayEvents().filter(function (e) { return !e.plan; }));
    renderPlan();
    refreshViews();
    toast('План убран из календаря');
  }

  document.getElementById('tab-cal').addEventListener('click', function () { setView('cal'); });
  document.getElementById('tab-plan').addEventListener('click', function () { setView('plan'); });
  document.getElementById('plan-load').addEventListener('click', openLoadSheet);
  document.getElementById('plan-remove').addEventListener('click', removePlanEvents);
  document.getElementById('plan-sheet-close').addEventListener('click', closeSheet);
  document.getElementById('load-close').addEventListener('click', closeSheet);
  document.getElementById('load-cancel').addEventListener('click', closeSheet);
  document.getElementById('load-go').addEventListener('click', doLoadPlan);
  document.getElementById('load-period').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip');
    if (!b) return;
    loadWeeks = +b.getAttribute('data-w');
    renderPeriodChips();
    renderLoadPreview();
  });
  document.getElementById('plan-time').addEventListener('change', function () {
    if (this.value) { plan.time = this.value; savePlan(); renderPlan(); }
  });

  renderChips();
  renderStatusSwitches();
  renderCalendar();
  renderDay();
})();
</script>
</body>
</html>
