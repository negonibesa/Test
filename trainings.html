<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<title>Петровское СП — Тренировки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eaf4ff;
  --surface: #ffffff;
  --surface-2: #eef6ff;
  --surface-warm: #f5faff;

  --fg: #12213b;
  --fg-2: #445269;
  --muted: #78859b;
  --meta: #99a4b7;

  --border: rgba(18,33,59,0.08);
  --border-soft: rgba(18,33,59,0.05);
  --border-strong: rgba(18,33,59,0.16);

  --accent: #1a86e0;
  --accent-on: #ffffff;
  --accent-hover: #2f97f0;
  --accent-active: #1473c9;
  --yellow: #ffc93c;
  --yellow-on: #12213b;

  --success: #2bb066;
  --warn: #ffc93c;
  --danger: #ff4d4d;

  --type-me: #2f9e54;
  --type-trainer: var(--yellow);
  --st-done: var(--meta);

  --font-display: "Oswald", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --leading-body: 1.5;
  --tracking-display: 0.01em;
  --tracking-caps: 0.08em;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 980px;

  --elev-raised: 0 16px 36px rgba(18,33,59,0.10);
  --focus-ring: 0 0 0 4px rgba(26,134,224,0.30);

  --motion-fast: 150ms;
  --motion-base: 220ms;
  --ease-standard: cubic-bezier(0.28,0,0.22,1);

  --container-max: 700px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, #deefff 0%, #f6fbff 35%, #eef6ff 100%);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; }
a { color: inherit; }

.app {
  position: relative;
  z-index: 1;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 0 calc(108px + env(safe-area-inset-bottom));
  min-height: 100vh;
}

/* ── Шапка ─────────────────────────────────────────────────────────── */
.hd {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 28px 12px 22px;
}
@media (min-width: 560px) { .hd { padding: 40px 24px 26px; } }
.avatar {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--accent-on);
  background: var(--type-me);
}
.hd-txt { flex: 1; min-width: 0; }
.hd h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  line-height: 1.3;
  text-transform: uppercase;
  color: var(--fg);
}
.hd .sub { margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.hd-acts { display: flex; gap: 8px; flex: none; }
.icon-btn {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg-2);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn svg { width: 22px; height: 22px; }

/* ── Тело ──────────────────────────────────────────────────────────── */
.body { padding: 0 12px; }
@media (min-width: 560px) { .body { padding: 0 24px; } }

/* ── Статы ─────────────────────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 560px) { .stats { gap: 12px; } }
.stat {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 14px 15px;
}
.stat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--meta);
}
.stat-label svg { width: 14px; height: 14px; color: var(--accent); }
.stat-value {
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat-value small { font-size: 13px; font-weight: 500; color: var(--muted); }
.stat-sub { margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--muted); }

/* ── Секции ────────────────────────────────────────────────────────── */
.sec { margin-top: 32px; }
.sec-head { display: flex; align-items: center; gap: 12px; padding: 0 2px 14px; }
.sec-head h2 {
  margin: 0; flex: 1;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
}
.sec-all {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  border: 0;
  background: none;
  min-height: 44px;
  padding: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
}
.sec-all:hover { color: var(--accent-hover); text-decoration: underline; }
.sec-all:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }
.sec-all svg { width: 16px; height: 16px; }
.cards { display: grid; gap: 12px; }
.empty {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 26px 16px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.empty b { display: block; font-size: 16px; font-weight: 600; color: var(--fg-2); margin-bottom: 3px; }

/* ── Сегодняшняя тренировка ────────────────────────────────────────── */
.today-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border-left: 3px solid var(--type-me);
  padding: 18px 18px 16px;
  animation: rise 0.5s var(--ease-standard) both;
}
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .today-card { animation: none; } }
.today-top { display: flex; align-items: flex-start; gap: 12px; }
.today-ic {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  color: var(--type-me);
  background: color-mix(in srgb, var(--type-me) 16%, var(--surface));
}
.today-ic svg { width: 20px; height: 20px; }
.today-txt { flex: 1; min-width: 0; }
.today-title {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
}
.today-meta { margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.today-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--type-me);
  background: color-mix(in srgb, var(--type-me) 12%, var(--surface));
  border-radius: 7px;
  padding: 3px 8px;
}
.today-badge .dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--type-me); }
.today-ex {
  margin: 14px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
}
.today-ex li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 15px;
  line-height: 1.4;
}
.today-ex .ex-num {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
}
.today-ex .ex-name { flex: 1; min-width: 0; color: var(--fg); }
.today-ex .ex-sets { flex: none; font-size: 13px; color: var(--meta); font-variant-numeric: tabular-nums; }
.cta {
  margin-top: 14px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--type-me);
  color: var(--accent-on);
  font-size: 16px;
  font-weight: 700;
  padding: 13px;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.cta:hover { background: color-mix(in srgb, var(--type-me) 88%, var(--bg)); }
.cta:active { background: color-mix(in srgb, var(--type-me) 80%, var(--bg)); }
.cta:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ── Неделя / стрик ────────────────────────────────────────────────── */
.week-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
}
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  text-align: center;
}
.wk-dow { font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--meta); margin-bottom: 5px; }
.wk-day {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin: 0 auto;
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--fg-2);
  background: var(--surface-2);
  border: 1px solid transparent;
}
.wk-day.is-done { background: color-mix(in srgb, var(--type-me) 16%, var(--surface)); color: var(--type-me); }
.wk-day.is-today { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.wk-day.is-miss { color: var(--meta); opacity: 0.5; }
.week-foot { margin: 12px 2px 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
.week-foot b { font-weight: 600; color: var(--fg-2); }

/* ── Карточка лога ─────────────────────────────────────────────────── */
.log-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border-left: 3px solid var(--c, var(--border));
  padding: 15px 16px 13px;
  animation: rise 0.5s var(--ease-standard) both;
  animation-delay: calc(var(--i, 0) * 60ms);
}
@media (prefers-reduced-motion: reduce) { .log-card { animation: none; } }
.log-top { display: flex; align-items: center; gap: 10px; }
.log-title {
  margin: 0;
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
}
.log-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--st-done);
  background: color-mix(in srgb, var(--st-done) 12%, var(--surface));
  border-radius: 7px;
  padding: 3px 8px;
}
.log-badge.is-cancelled { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.log-meta { margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
.log-meta b { font-weight: 600; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.log-foot { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.log-stat { font-size: 12px; line-height: 1.4; color: var(--muted); }
.log-replay {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: var(--surface-2);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radius-pill);
  padding: 8px 15px;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.log-replay:hover { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.log-replay:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.log-replay svg { width: 14px; height: 14px; }

/* ── Таб-бар: плавающая «капсула» ─────────────────────────────────── */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: calc(var(--container-max) - 24px);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  z-index: 30;
}
.tab {
  position: relative;
  border: 0;
  background: none;
  text-decoration: none;
  display: grid;
  place-items: center;
  padding: 5px 0;
  color: var(--meta);
  cursor: pointer;
  border-radius: var(--radius-md);
}
.tab svg { width: 24px; height: 24px; }
.tab-ic { position: relative; display: grid; place-items: center; }
.tab.is-on { color: var(--accent); }
.tab.is-on svg {
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  border-radius: var(--radius-pill);
  padding: 7px;
  width: 42px;
  height: 42px;
  box-sizing: border-box;
}
.tab:not(.is-on):active { color: var(--fg-2); }
.tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ── Тост ──────────────────────────────────────────────────────────── */
.toast-wrap {
  position: fixed;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  z-index: 70;
  width: max-content;
  max-width: calc(100vw - 40px);
}
.toast {
  background: var(--fg);
  color: var(--bg);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.35;
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  box-shadow: var(--elev-raised);
  animation: toast-in 0.3s var(--ease-standard) both;
}
.toast.hide { animation: toast-out 0.25s var(--ease-standard) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>

<div class="app">
  <header class="hd" data-od-id="trn-header">
    <div class="avatar" aria-hidden="true">Т</div>
    <div class="hd-txt">
      <h1>Тренировки</h1>
      <p class="sub">Программа на неделю и журнал занятий</p>
    </div>
    <div class="hd-acts">
      <button type="button" class="icon-btn" data-toast="Журнал за всё время — в полной версии" aria-label="Журнал"><svg aria-hidden="true"><use href="#ic-dots"/></svg></button>
    </div>
  </header>

  <main class="body">
    <section class="stats" data-od-id="trn-stats">
      <div class="stat">
        <div class="stat-label"><svg aria-hidden="true"><use href="#ic-trend"/></svg>Тренировок</div>
        <div class="stat-value">2<small> / 3</small></div>
        <div class="stat-sub">по плану на неделе</div>
      </div>
      <div class="stat">
        <div class="stat-label"><svg aria-hidden="true"><use href="#ic-clock"/></svg>Часов</div>
        <div class="stat-value">3,5</div>
        <div class="stat-sub">активной работы</div>
      </div>
      <div class="stat">
        <div class="stat-label"><svg aria-hidden="true"><use href="#ic-cal"/></svg>Подряд</div>
        <div class="stat-value">3</div>
        <div class="stat-sub">дня с тренировкой</div>
      </div>
    </section>

    <section class="sec" data-od-id="trn-today">
      <div class="sec-head">
        <h2>Сегодня</h2>
      </div>
      <div class="today-card" id="today-card">
        <div class="today-top">
          <span class="today-ic" aria-hidden="true"><svg><use href="#ic-run"/></svg></span>
          <div class="today-txt">
            <h3 class="today-title" id="today-title"></h3>
            <p class="today-meta" id="today-meta"></p>
          </div>
          <span class="today-badge" data-od-id="trn-today-badge"><span class="dot" aria-hidden="true"></span>План</span>
        </div>
        <ul class="today-ex" id="today-ex"></ul>
        <button type="button" class="cta" id="trn-start" data-od-id="trn-start">Начать тренировку</button>
      </div>
    </section>

    <section class="sec" data-od-id="trn-week">
      <div class="sec-head">
        <h2>Неделя</h2>
      </div>
      <div class="week-card">
        <div class="week" id="week"></div>
        <p class="week-foot" id="week-foot"></p>
      </div>
    </section>

    <section class="sec" data-od-id="trn-logs">
      <div class="sec-head">
        <h2>Последние тренировки</h2>
        <button type="button" class="sec-all" data-toast="Полный журнал — в полной версии">Вся история<svg aria-hidden="true"><use href="#ic-chev"/></svg></button>
      </div>
      <div class="cards" id="trn-logs"></div>
    </section>
  </main>
</div>

<nav class="tabbar" data-od-id="tabbar" aria-label="Разделы">
  <a class="tab" href="home-athlete-brand.html" aria-label="Главная"><svg aria-hidden="true"><use href="#ic-home"/></svg></a>
  <a class="tab" href="schedule-calendar.html" aria-label="Расписание"><svg aria-hidden="true"><use href="#ic-events"/></svg></a>
  <button class="tab is-on" aria-label="Тренировки"><svg aria-hidden="true"><use href="#ic-trend"/></svg></button>
  <button class="tab" data-toast="Сообщество — в следующей итерации" aria-label="Сообщество"><svg aria-hidden="true"><use href="#ic-users"/></svg></button>
  <a class="tab" href="profile.html" aria-label="Профиль"><svg aria-hidden="true"><use href="#ic-user"/></svg></a>
</nav>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var LS_PLAN = 'trn:plan';
  var LS_ACTIVE = 'trn:active';
  var LS_LOGS = 'trn:logs';
  var LS_REPORT = 'trn:report';

  function defaultPlan() {
    return {
      id: 'plan-sila',
      title: 'Силовая тренировка',
      date: 'Сегодня',
      time: '18:00 – 19:30',
      place: 'Тренажёрный зал',
      type: 'me',
      exercises: [
        { name: 'Жим штанги лёжа', sets: '4 × 8 · 40 кг' },
        { name: 'Приседания со штангой', sets: '4 × 10 · 50 кг' },
        { name: 'Тяга верхнего блока', sets: '3 × 12 · 30 кг' },
        { name: 'Подъём на бицепс стоя', sets: '3 × 12 · 12 кг' },
        { name: 'Скручивания на пресс', sets: '3 × 20' }
      ]
    };
  }

  function defaultLogs() {
    return [
      {
        id: 'log1', title: 'Силовая тренировка', date: 'Чт, 6 авг', time: '07:00 – 08:00',
        done: 5, total: 5, dur: 58, status: 'done', exercises: defaultPlan().exercises
      },
      {
        id: 'log2', title: 'Плавание', date: 'Вт, 4 авг', time: '07:00 – 08:00',
        done: 3, total: 4, dur: 46, status: 'done', exercises: [
          { name: 'Разминка в воде', sets: '10 мин' },
          { name: 'Кроль, техника', sets: '6 × 100 м' },
          { name: 'Брасс, техника', sets: '4 × 50 м' },
          { name: 'Заминка', sets: '5 мин' }
        ]
      },
      {
        id: 'log3', title: 'Вечерняя пробежка клуба', date: 'Сб, 2 авг', time: '19:00 – 20:30',
        done: 1, total: 1, dur: 61, status: 'done', exercises: [
          { name: 'Кросс 5 км', sets: '5 км' }
        ]
      },
      {
        id: 'log4', title: 'Силовая тренировка', date: 'Пн, 28 июл', time: '18:00 – 19:30',
        done: 2, total: 5, dur: 41, status: 'cancelled', exercises: defaultPlan().exercises
      }
    ];
  }

  function lsGet(key, fallback) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* noop */ }
  }

  function byId(id) { return document.getElementById(id); }

  function toast(msg) {
    var wrap = byId('toasts');
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.classList.add('hide');
      setTimeout(function () { t.remove(); }, 260);
    }, 2200);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var plan = defaultPlan();
  var logs = defaultLogs();

  try {
    var storedPlan = lsGet(LS_PLAN);
    if (storedPlan) plan = JSON.parse(storedPlan);
    var storedLogs = lsGet(LS_LOGS);
    if (storedLogs) logs = JSON.parse(storedLogs);
  } catch (e) { /* use defaults */ }

  function renderToday() {
    byId('today-title').textContent = plan.title;
    byId('today-meta').textContent = (plan.time ? plan.time + ' · ' : '') + plan.place;
    var ul = byId('today-ex');
    ul.innerHTML = '';
    plan.exercises.forEach(function (ex, i) {
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="ex-num">' + (i + 1) + '</span>' +
        '<span class="ex-name">' + esc(ex.name) + '</span>' +
        '<span class="ex-sets">' + esc(ex.sets || '') + '</span>';
      ul.appendChild(li);
    });
  }

  function renderWeek() {
    var days = [
      { d: 'Пн', n: 28, s: 'done' },
      { d: 'Вт', n: 29, s: 'done' },
      { d: 'Ср', n: 30, s: 'done' },
      { d: 'Чт', n: 31, s: 'done' },
      { d: 'Пт', n: 1, s: 'today' },
      { d: 'Сб', n: 2, s: 'miss' },
      { d: 'Вс', n: 3, s: 'miss' }
    ];
    var week = byId('week');
    week.innerHTML = '';
    days.forEach(function (d) {
      var col = document.createElement('div');
      col.innerHTML =
        '<div class="wk-dow">' + d.d + '</div>' +
        '<div class="wk-day ' + (d.s === 'today' ? 'is-today' : d.s === 'done' ? 'is-done' : d.s === 'miss' ? 'is-miss' : '') + '">' + d.n + '</div>';
      week.appendChild(col);
    });
    byId('week-foot').innerHTML =
      'Уже 3 тренировки подряд — <b>держите серию!</b> План на неделю: 3 из 3.';
  }

  function renderLogs() {
    var wrap = byId('trn-logs');
    wrap.innerHTML = '';
    if (!logs.length) {
      wrap.innerHTML = '<div class="empty"><b>Тренировок пока нет</b>Начните первую — план уже готов на сегодня</div>';
      return;
    }
    logs.slice(0, 4).forEach(function (log, i) {
      var card = document.createElement('div');
      card.className = 'log-card';
      card.style.setProperty('--i', i);
      card.style.setProperty('--c', log.status === 'cancelled' ? 'var(--danger)' : 'var(--type-me)');
      var donePct = log.total ? Math.round(log.done / log.total * 100) : 100;
      var badge = log.status === 'cancelled'
        ? '<span class="log-badge is-cancelled">Отменено</span>'
        : '<span class="log-badge">Завершено</span>';
      card.innerHTML =
        '<div class="log-top"><h4 class="log-title">' + esc(log.title) + '</h4>' + badge + '</div>' +
        '<p class="log-meta">' + esc(log.date) + ' · ' + esc(log.time) +
        '<br>Выполнено <b>' + log.done + ' из ' + log.total + '</b> упражнений · ' + log.dur + ' мин</p>' +
        '<div class="log-foot">' +
        '<span class="log-stat">' + donePct + '% программы</span>' +
        '<button type="button" class="log-replay" data-replay="' + esc(log.id) + '"><svg aria-hidden="true"><use href="#ic-refresh"/></svg>Повторить</button>' +
        '</div>';
      wrap.appendChild(card);
    });
  }

  function saveActive() {
    var active = {
      planId: plan.id,
      title: plan.title,
      time: plan.time,
      place: plan.place,
      dateLabel: plan.date,
      startTs: Date.now(),
      exercises: plan.exercises.map(function (ex) {
        return { name: ex.name, sets: ex.sets, done: false };
      })
    };
    lsSet(LS_ACTIVE, JSON.stringify(active));
  }

  function start() {
    saveActive();
    location.href = 'training-active.html';
  }

  function replay(logId) {
    var log = null;
    logs.forEach(function (l) { if (l.id === logId) log = l; });
    if (!log) return;
    plan = {
      id: log.id,
      title: log.title,
      date: 'Сегодня',
      time: log.time,
      place: log.place || 'Тренажёрный зал',
      type: log.type || 'me',
      exercises: log.exercises
    };
    lsSet(LS_PLAN, JSON.stringify(plan));
    renderToday();
    start();
  }

  byId('trn-start').addEventListener('click', start);

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-replay]') : null;
    if (btn) replay(btn.getAttribute('data-replay'));
  });

  document.querySelectorAll('[data-toast]').forEach(function (b) {
    b.addEventListener('click', function () { toast(b.getAttribute('data-toast')); });
  });

  renderToday();
  renderWeek();
  renderLogs();
})();
</script>
</body>
</html>
