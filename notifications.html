<style>
  .back svg { transform: rotate(180deg); }
  .eyebrow {
    margin: 0 0 var(--space-1);
    font-size: var(--fs-caption); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--meta);
  }

  .markall {
    display: inline-flex; align-items: center; gap: var(--space-2);
    padding: 0 var(--space-4); height: var(--h-base);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    background: var(--surface); color: var(--accent);
    font-size: var(--fs-meta); font-weight: 600; cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
  }
  .markall:hover { background: var(--surface-2); }
  .markall:active { transform: scale(0.98); }
  .markall:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .markall svg { width: var(--icon-sm); height: var(--icon-sm); }
  .markall:disabled { opacity: 0.5; cursor: default; }

  .chips {
    display: flex; gap: var(--space-2); overflow-x: auto;
    padding: 0 var(--space-3) var(--space-3);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .chips { padding: 0 var(--space-6) var(--space-4); } }
  .fchip .cnt {
    display: grid; place-items: center; min-width: 18px; height: 18px;
    padding: 0 var(--space-1); border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted);
    font-size: var(--fs-caption); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .fchip.is-on .cnt { background: rgba(255,255,255,0.22); color: var(--accent-on); }

  .group-label {
    display: flex; align-items: center; gap: var(--space-2);
    margin: var(--space-5) 0 var(--space-2);
  }
  .group-label:first-child { margin-top: var(--space-3); }
  .group-label span {
    font-family: var(--font-display); font-size: var(--fs-meta); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap;
  }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }

  .n-card {
    display: flex; gap: var(--space-3); position: relative;
    padding: var(--space-4);
    margin-bottom: var(--space-2);
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius-md); box-shadow: var(--elev-card);
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
  }
  .n-card:hover { background: var(--surface-2); }
  .n-card:active { transform: scale(0.995); }
  .n-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .n-card.is-unread { border-color: color-mix(in srgb, var(--accent) 34%, var(--border)); }
  .n-card.is-unread::before {
    content: ""; position: absolute; top: 16px; right: 14px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .n-meta svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: var(--space-1); }
  .n-link svg { width: 12px; height: 12px; vertical-align: -2px; margin-left: var(--space-1); }
  .n-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .settings-row {
    display: flex; align-items: center; gap: var(--space-3);
    width: 100%; text-align: left; cursor: pointer;
    margin: var(--space-5) 0 0; padding: var(--space-4);
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius-md); box-shadow: var(--elev-card);
    color: inherit; font-family: inherit; font-size: var(--fs-body);
    -webkit-appearance: none; appearance: none;
    transition: background var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
  }
  .settings-row:hover { background: var(--surface-2); }
  .settings-row:active { transform: scale(0.995); }
  .settings-row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .settings-row .s-ic {
    flex: none; width: 40px; height: 40px; border-radius: var(--radius-md);
    display: grid; place-items: center; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  }
  .settings-row .s-ic svg { width: var(--icon-md); height: var(--icon-md); }
  .settings-row b { display: block; font-size: var(--fs-body); }
  .settings-row small { display: block; font-size: var(--fs-caption); color: var(--meta); margin-top: 2px; }
  .settings-row .s-chev { flex: none; color: var(--meta); }
  .settings-row .s-chev svg { width: var(--icon-sm); height: var(--icon-sm); }

  .set-row {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) 0;
    border-top: 1px solid var(--border-soft);
  }
  .set-row b { display: block; font-size: var(--fs-body); }
  .set-row small { display: block; font-size: var(--fs-meta); color: var(--meta); margin-top: 2px; line-height: 1.4; }
</style>
</head>

<script>
(function () {
  'use strict';

  function byId(id) { return document.getElementById(id); }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = msg;
    byId('toasts').appendChild(t);
    setTimeout(function () { t.classList.add('hide'); }, 2200);
    setTimeout(function () { t.remove(); }, 2500);
  }

  var TONE = {
    event:   { ic: 'ic-events',    c: 'var(--type-event)' },
    club:    { ic: 'ic-users',     c: 'var(--type-club)' },
    me:      { ic: 'ic-run',       c: 'var(--type-training)' },
    trainer: { ic: 'ic-dumbbell',  c: 'var(--yellow)' },
    rental:  { ic: 'ic-cal',       c: 'var(--type-rental)' },
    points:  { ic: 'ic-star',      c: 'var(--yellow)' },
    gto:     { ic: 'ic-medal',     c: 'var(--gto-bronze)' },
    system:  { ic: 'ic-bell',      c: 'var(--meta)' }
  };

  var FILTERS = [
    { key: 'all',    label: 'Все' },
    { key: 'event',  label: 'События' },
    { key: 'train',  label: 'Тренировки' },
    { key: 'points', label: 'Баллы' },
    { key: 'gto',    label: 'ГТО' },
    { key: 'system', label: 'Система' }
  ];

  var NOTIFS = [
    { id: 'n1', group: 'today', cat: 'event', tone: 'event',  title: 'Летний Кубок Петровского', text: 'Напоминаем: соревнование завтра в 10:00 на стадионе «Центральный». Вы записаны.', time: '10:32', unread: true, href: 'schedule-calendar.html' },
    { id: 'n2', group: 'today', cat: 'points', tone: 'points', title: '+50 баллов', text: '3-е место на «Летнем Кубке Петровского» — баллы зачислены на баланс.', time: '09:15', unread: true, href: 'points-ratings.html' },
    { id: 'n3', group: 'today', cat: 'event', tone: 'club',   title: 'Приглашение: «Сплав на байдарках»', text: 'Андрей Волков приглашает вас на сплав — сб, 23 авг, 09:00. Участников: 6.', time: '08:47', unread: true, actions: [{ k: 'accept', label: 'Принять' }, { k: 'decline', label: 'Отклонить' }] },
    { id: 'n4', group: 'today', cat: 'train', tone: 'trainer', title: 'Тренер подтвердил тренировку', text: '«Силовая тренировка с тренером» — завтра в 08:00, Зал № 2. Тренер А. Соколов.', time: '07:30', unread: true, href: 'schedule-calendar.html' },
    { id: 'n5', group: 'today', cat: 'gto',   tone: 'gto',    title: 'Норматив ГТО засчитан', text: '«Подтягивания» — 20 раз. Серебряный знак ГТО привязан к профилю.', time: '06:05', unread: true, href: 'gto.html' },
    { id: 'n6', group: 'earlier', cat: 'points', tone: 'points', title: '+40 баллов', text: 'Тренировка в тренажёрном зале — начислено по QR-коду.', time: 'Вчера', href: 'points-ratings.html' },
    { id: 'n7', group: 'earlier', cat: 'train',  tone: 'me',     title: 'Напоминание: «Плавание»', text: 'Тренировка в 07:00, бассейн «Волна». Возьмите QR-код для входа.', time: 'Вчера', href: 'qrscan.html' },
    { id: 'n8', group: 'earlier', cat: 'event',  tone: 'rental', title: 'Аренда зала подтверждена', text: 'Зал № 1, ср 20 авг, 20:00 – 22:00. Оплата по абонементу.', time: 'Пн', href: 'create-event.html' },
    { id: 'n9', group: 'earlier', cat: 'gto',    tone: 'gto',    title: 'Сдача норматива: «Бег 100 м»', text: '12 августа, стадион «Центральный». План подготовки — в дневнике ГТО.', time: 'Пн', href: 'gto-test.html' },
    { id: 'n10', group: 'earlier', cat: 'system', tone: 'system', title: 'QR-код зала обновлён', text: 'Используйте актуальный QR — код меняется каждые 3 минуты (античит).', time: 'Вс', href: 'qrscan.html' },
    { id: 'n11', group: 'earlier', cat: 'points', tone: 'points', title: '+10 баллов за серию', text: 'Серия активных дней: 3 дня подряд — бонус зачислен.', time: 'Сб', href: 'points-ratings.html' },
    { id: 'n12', group: 'earlier', cat: 'system', tone: 'system', title: 'Обновление 1.4', text: 'Уведомления и календарь стали быстрее. Спасибо, что вы с нами!', time: 'Пт' }
  ];

  var SETTINGS = [
    { key: 'events',   label: 'События и приглашения',   sub: 'Напоминания, записи, приглашения в события', on: true },
    { key: 'train',    label: 'Тренировки и тренер',     sub: 'Подтверждение тренера, напоминания о занятии', on: true },
    { key: 'points',   label: 'Баллы и достижения',      sub: 'Начисления, серии и уровни', on: true },
    { key: 'gto',      label: 'ГТО',                     sub: 'Нормативы, сдачи, планы подготовки', on: true },
    { key: 'system',   label: 'Системные',               sub: 'QR-коды, обновления, безопасность', on: true },
    { key: 'push',     label: 'Push-уведомления',        sub: 'Мгновенные уведомления на устройство', on: true }
  ];

  var state = { filter: 'all', settings: SETTINGS.slice() };

  function list() {
    return NOTIFS.filter(function (n) {
      return state.filter === 'all' || n.cat === state.filter;
    });
  }
  function unreadCount() {
    return NOTIFS.filter(function (n) { return n.unread; }).length;
  }
  function catCount(key) {
    return key === 'all' ? NOTIFS.length : NOTIFS.filter(function (n) { return n.cat === key; }).length;
  }

  function renderFilters() {
    var box = byId('notif-filters');
    box.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'fchip' + (state.filter === f.key ? ' is-on' : '');
      b.setAttribute('data-od-id', 'notif-filter-' + f.key);
      b.innerHTML = f.label + '<span class="cnt">' + catCount(f.key) + '</span>';
      b.addEventListener('click', function () {
        state.filter = f.key;
        renderFilters();
        renderList();
      });
      box.appendChild(b);
    });
  }

  function markRead(n) {
    if (!n.unread) return;
    n.unread = false;
    renderHeader();
    renderFilters();
  }

  function renderHeader() {
    var c = unreadCount();
    byId('notif-sub').textContent =
      c === 0 ? 'Нет непрочитанных' : (c === 1 ? '1 непрочитанное' : c + ' непрочитанных');
    byId('notif-markall').disabled = c === 0;
  }

  function cardHTML(n) {
    var t = TONE[n.tone] || TONE.system;
    var html = '';
    html += '<div class="n-card' + (n.unread ? ' is-unread' : '') + '" data-od-id="notif-item" style="--c:' + t.c + '">';
    html += '<span class="n-ic" aria-hidden="true"><svg><use href="#' + t.ic + '"/></svg></span>';
    html += '<span class="n-body">';
    html += '<span class="n-title">' + n.title + '</span>';
    html += '<span class="n-text">' + n.text + '</span>';
    html += '<span class="n-meta"><svg aria-hidden="true"><use href="#ic-clock"/></svg>' + n.time + '</span>';
    if (n.actions) {
      html += '<span class="n-acts">';
      n.actions.forEach(function (a) {
        var cls = a.k === 'decline' ? 'n-btn-secondary' : 'n-btn-primary';
        html += '<button type="button" class="n-btn ' + cls + '" data-act="' + a.k + '">' +
                (a.k === 'decline' ? '<svg aria-hidden="true"><use href="#ic-x"/></svg>' : '<svg aria-hidden="true"><use href="#ic-check"/></svg>') +
                a.label + '</button>';
      });
      html += '</span>';
    } else if (n.href) {
      html += '<a class="n-link" href="' + n.href + '">Открыть<svg aria-hidden="true"><use href="#ic-chev"/></svg></a>';
    }
    html += '</span>';
    html += '</div>';
    return html;
  }

  function renderList() {
    var box = byId('notif-list');
    var items = list();
    if (!items.length) {
      box.innerHTML = '<div class="empty" data-od-id="notif-empty"><svg aria-hidden="true"><use href="#ic-bell"/></svg><b>Здесь пусто</b><span>В этом разделе пока нет уведомлений</span></div>';
      return;
    }
    var html = '';
    var groups = [{ key: 'today', label: 'Сегодня' }, { key: 'earlier', label: 'Ранее' }];
    groups.forEach(function (g) {
      var sub = items.filter(function (n) { return n.group === g.key; });
      if (!sub.length) return;
      html += '<h2 class="group-label"><span>' + g.label + '</span></h2>';
      sub.forEach(function (n) { html += cardHTML(n); });
    });
    box.innerHTML = html;

    box.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        var card = btn.closest('.n-card');
        var idx = Array.prototype.indexOf.call(box.querySelectorAll('.n-card'), card);
        var cur = list();
        var n = cur[idx];
        if (!n) return;
        ev.stopPropagation();
        if (btn.getAttribute('data-act') === 'accept') {
          n.actions = null;
          markRead(n);
          toast('Вы приняли приглашение');
        } else {
          NOTIFS.splice(NOTIFS.indexOf(n), 1);
          toast('Приглашение отклонено');
        }
        renderList();
      });
    });

    box.querySelectorAll('.n-card').forEach(function (card, idx) {
      card.addEventListener('click', function () {
        var cur = list();
        var n = cur[idx];
        if (!n) return;
        markRead(n);
        if (n.href) {
          location.href = n.href;
        } else {
          renderList();
        }
      });
    });
  }

  function renderSettings() {
    var box = byId('sheet-rows');
    box.innerHTML = '';
    state.settings.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'set-row';
      row.innerHTML = '<span style="flex:1;min-width:0;"><b>' + s.label + '</b><small>' + s.sub + '</small></span>';
      var sw = document.createElement('label');
      sw.className = 'switch';
      sw.innerHTML = '<input type="checkbox" ' + (s.on ? 'checked' : '') + '><span class="track"></span>';
      var cb = sw.querySelector('input');
      cb.addEventListener('change', function () {
        s.on = cb.checked;
        toast(cb.checked ? 'Уведомления включены' : 'Уведомления отключены');
      });
      row.appendChild(sw);
      box.appendChild(row);
    });
  }

  function openSheet() {
    byId('scrim').classList.add('open');
    byId('sheet').classList.add('open');
    renderSettings();
  }
  function closeSheet() {
    byId('scrim').classList.remove('open');
    byId('sheet').classList.remove('open');
    if (location.hash === '#settings') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
  }

  byId('notif-markall').addEventListener('click', function () {
    var any = NOTIFS.some(function (n) { return n.unread; });
    NOTIFS.forEach(function (n) { n.unread = false; });
    renderHeader();
    renderFilters();
    renderList();
    if (any) toast('Все уведомления прочитаны');
  });

  byId('notif-settings').addEventListener('click', openSheet);
  byId('sheet-x').addEventListener('click', closeSheet);
  byId('sheet-done').addEventListener('click', closeSheet);
  byId('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && byId('sheet').classList.contains('open')) closeSheet();
  });

  document.querySelectorAll('[data-toast]').forEach(function (b) {
    b.addEventListener('click', function () { toast(b.getAttribute('data-toast')); });
  });

  renderHeader();
  renderFilters();
  renderList();
  if (location.hash === '#settings') openSheet();
})();
</script>
</body>
</html>
