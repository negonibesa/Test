<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4B79FB">
<title>Загрузка</title>
<style>
:root{
  --splash:#4B79FB;
  --ring:#618AFF;
  --ring-cap:#ffd200;
  --on:#ffffff;
  --font-body:Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;display:grid;place-items:center;
  background:var(--splash);color:var(--on);
  font-family:var(--font-body);-webkit-font-smoothing:antialiased;
}

/* Center: flag + loading ring */
.splash{
  height:100%;height:100dvh;
  display:flex;align-items:center;justify-content:center;
}
.brand-logo{
  position:relative;width:176px;height:176px;flex:none;
  animation:brand-in .5s cubic-bezier(.2,0,0,1) both;
}
.brand-logo img{position:absolute;inset:0;margin:auto;width:156px;height:156px;border-radius:50%;object-fit:cover}
.loadring{position:absolute;inset:0;transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.loadring path{fill:none;stroke:var(--ring);stroke-width:4;stroke-linecap:round}
.loadring .cap{fill:var(--ring-cap)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes brand-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .loadring{animation:none}
  .brand-logo{animation:none}
}
</style>
</head>
