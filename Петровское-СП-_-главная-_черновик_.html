:root {

  --danger: #ff5a5a;

  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px; --radius-pill: 980px;

  --motion-fast: 150ms; --ease-standard: cubic-bezier(.28,0,.22,1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-warm); font-family: var(--font-body); color: var(--fg); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
a { color: inherit; text-decoration: none; }
.app { max-width: 420px; margin: 0 auto; padding: 0 0 calc(88px + env(safe-area-inset-bottom)); }
.body { padding: 0 var(--space-4); }

/* Шапка */
.hd { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-4) var(--space-3); }
.hd-ava { flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--surface-2); }
.hd-ava svg { width: 100%; height: 100%; }
.hd-title { flex: 1; min-width: 0; margin: 0; font-size: var(--fs-title); font-weight: 700; }
.hd-acts { display: flex; gap: var(--space-2); flex: none; }
.icon-btn { position: relative; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--surface); box-shadow: var(--elev-card); display: grid; place-items: center; color: var(--fg-2); cursor: pointer; }
.icon-btn svg { width: var(--icon-md); height: var(--icon-md); }
.icon-btn .badge { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

/* Статус-строка */
.status-row { display: flex; align-items: center; gap: var(--space-2); background: var(--surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); box-shadow: var(--elev-card); font-size: var(--fs-meta); color: var(--fg-2); }
.status-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
.status-row .sep { color: var(--border); }
.status-row svg { width: var(--icon-sm); height: var(--icon-sm); color: var(--muted); flex: none; }

/* Карточка комплекса */
.complex-card { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-3); background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--elev-card); cursor: pointer; border: 0; width: 100%; text-align: left; }
.complex-tx .cap { display: block; font-size: var(--fs-caption); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.complex-tx .title { display: block; margin-top: 2px; font-size: var(--fs-title); font-weight: 700; }
.complex-card .go { flex: none; color: var(--meta); }
.complex-card .go svg { width: var(--icon-md); height: var(--icon-md); }

/* Карточка цели */
.goal-card { margin-top: var(--space-3); background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-4) var(--space-5); box-shadow: var(--elev-card); }
.goal-top { display: flex; align-items: baseline; justify-content: space-between; }
.goal-label { font-size: var(--fs-title); font-weight: 700; }
.goal-val { font-size: var(--fs-title); color: var(--fg-2); }
.goal-val b { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--fg); }
.goal-top .go { color: var(--meta); }
.goal-top .go svg { width: var(--icon-md); height: var(--icon-md); }

.arc-wrap { position: relative; margin-top: var(--space-4); width: 100%; height: 148px; }
.arc-wrap svg { width: 100%; height: 100%; }
.arc-track { fill: none; stroke: var(--surface-2); stroke-width: 16; }
.arc-fill { fill: none; stroke: var(--success); stroke-width: 16; stroke-linecap: round; }
.arc-pill {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border-soft); box-shadow: var(--elev-card);
  border-radius: var(--radius-pill); padding: 8px 16px; font-size: var(--fs-meta); font-weight: 600; color: var(--fg-2);
}
.arc-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gto-silver); }

/* Баллы / достижения / рейтинг */
.stats-card { margin-top: var(--space-3); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--elev-card); overflow: hidden; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; }
.stats-grid > div { padding: var(--space-4); }
.stats-grid > div:first-child { border-right: 1px solid var(--border-soft); }
.stat-cap { font-size: var(--fs-meta); color: var(--muted); font-weight: 500; }
.stat-num { display: flex; align-items: center; gap: 6px; margin-top: var(--space-1); font-family: var(--font-mono); font-size: 24px; font-weight: 700; }
.stat-num svg { width: var(--icon-md); height: var(--icon-md); }
.stat-num .ic-amber { color: var(--amber); }
.stat-num .ic-silver { color: var(--gto-silver); }
.stat-delta { display: inline-block; margin-top: var(--space-2); background: color-mix(in srgb, var(--success) 14%, var(--surface)); color: color-mix(in oklab, var(--success), var(--fg) 20%); font-size: var(--fs-caption); font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); }
.rating-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border-top: 1px solid var(--border-soft); font-size: var(--fs-meta); font-weight: 600; color: var(--fg-2); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.rating-row svg { width: var(--icon-md); height: var(--icon-md); color: var(--accent); flex: none; }

/* Секция событий */
.sec { margin-top: var(--space-6); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--space-1) var(--space-3); }
.sec-head h2 { margin: 0; font-size: var(--fs-title); font-weight: 700; }
.sec-all { font-size: var(--fs-meta); font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 3px; }
.sec-all svg { width: 14px; height: 14px; }

.ev-card { display: flex; align-items: center; gap: var(--space-3); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--elev-card); padding: var(--space-4); border-left: 4px solid var(--c, var(--success)); }
.ev-when { flex: none; width: 56px; text-align: left; }
.ev-when .day { display: block; font-size: var(--fs-caption); color: var(--muted); }
.ev-when .time { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: var(--fs-time); font-weight: 700; }
.ev-body { flex: 1; min-width: 0; }
.ev-title { margin: 0; font-size: var(--fs-body); font-weight: 700; line-height: 1.25; }
.ev-fmt { display: inline-block; margin-top: 4px; font-size: var(--fs-caption); color: var(--muted); }
.ev-status { flex: none; font-size: var(--fs-caption); font-weight: 700; color: color-mix(in oklab, var(--success), var(--fg) 20%); background: color-mix(in srgb, var(--success) 14%, var(--surface)); border-radius: var(--radius-pill); padding: 5px 10px; }
.ev-menu { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--fg-2); display: grid; place-items: center; cursor: pointer; }
.ev-menu svg { width: var(--icon-sm); height: var(--icon-sm); }

/* Таббар */
.tabbar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 420px; background: var(--surface); border-top: 1px solid var(--border-soft); display: grid; grid-template-columns: repeat(5,1fr); padding: var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom)); }
.tab { border: 0; background: none; display: grid; place-items: center; padding: var(--space-2) 0; color: var(--meta); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab.is-on svg { color: var(--accent-on); }
.tab.is-on span { background: var(--accent); border-radius: var(--radius-md); width: 44px; height: 32px; display: grid; place-items: center; }
</style>
</head>
