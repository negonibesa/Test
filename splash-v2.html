<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<title>Петровское СП — загрузка</title>
<link rel="preload" as="image" href="Splash_spriteSheet-9x4.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ── Токены дизайн-системы (канон · design-system.html) ─────────────── */
:root {
  --bg: #eaf4ff;
  --surface: #ffffff;
  --surface-2: #eef6ff;
  --surface-warm: #f5faff;

  --fg: #12213b;
  --fg-2: #445269;
  --muted: #5d6b82;
  --meta: #66748e;

  --border: rgba(18,33,59,0.08);
  --border-soft: rgba(18,33,59,0.05);
  --border-strong: rgba(18,33,59,0.16);

  --accent: #0d6fc4;
  --accent-on: #ffffff;
  --accent-hover: #2b8fe0;
  --accent-active: #0a5da8;
  --yellow: #ffc93c;
  --yellow-on: #12213b;

  --success: #2bb066;
  --warn: #ffc93c;
  --danger: #ff4d4d;

  --font-display: "Oswald", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --fs-display: 28px;
  --fs-title: 18px;
  --fs-body: 16px;
  --fs-meta: 13px;
  --fs-caption: 11px;

  --leading-body: 1.5;
  --tracking-display: 0.01em;
  --tracking-caps: 0.08em;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 980px;

  --motion-fast: 150ms;
  --motion-base: 220ms;
  --ease-standard: cubic-bezier(0.28,0,0.22,1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background: var(--bg);
  overflow: hidden;
}

.splash {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px calc(56px + env(safe-area-inset-bottom));
  opacity: 1;
  animation: splash-in 0.4s var(--ease-standard) 0.05s backwards;
}
@keyframes splash-in { from { opacity: 0; } to { opacity: 1; } }
body.fade .splash { opacity: 0; transform: scale(0.985); transition: opacity 0.3s var(--ease-standard), transform 0.3s var(--ease-standard); }

.splash-plate {
  position: relative;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--yellow);
  transform: scale(0.2);
  opacity: 0;
}
body.ready .splash-plate {
  animation: plate-grow 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both;
}
@keyframes plate-grow {
  from { transform: scale(0.2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.splash-sprite {
  flex: 0 0 auto;
  width: 280px;
  height: 280px;
  background-image: url("Splash_spriteSheet-9x4.png");
  background-repeat: no-repeat;
  background-size: 400% 900%;
  background-position: 0% 0%;
  opacity: 0;
  transition: opacity 0.4s var(--ease-standard);
}
body.ready .splash-sprite {
  opacity: 1;
  animation: splash-sprite 1s steps(1, end) infinite;
}

@keyframes splash-sprite {
  0%      { background-position: 0% 0%; }
  2.7778% { background-position: 33.333% 0%; }
  5.5556% { background-position: 66.667% 0%; }
  8.3333% { background-position: 100% 0%; }
  11.1111% { background-position: 0% 12.5%; }
  13.8889% { background-position: 33.333% 12.5%; }
  16.6667% { background-position: 66.667% 12.5%; }
  19.4444% { background-position: 100% 12.5%; }
  22.2222% { background-position: 0% 25%; }
  25%     { background-position: 33.333% 25%; }
  27.7778% { background-position: 66.667% 25%; }
  30.5556% { background-position: 100% 25%; }
  33.3333% { background-position: 0% 37.5%; }
  36.1111% { background-position: 33.333% 37.5%; }
  38.8889% { background-position: 66.667% 37.5%; }
  41.6667% { background-position: 100% 37.5%; }
  44.4444% { background-position: 0% 50%; }
  47.2222% { background-position: 33.333% 50%; }
  50%     { background-position: 66.667% 50%; }
  52.7778% { background-position: 100% 50%; }
  55.5556% { background-position: 0% 62.5%; }
  58.3333% { background-position: 33.333% 62.5%; }
  61.1111% { background-position: 66.667% 62.5%; }
  63.8889% { background-position: 100% 62.5%; }
  66.6667% { background-position: 0% 75%; }
  69.4444% { background-position: 33.333% 75%; }
  72.2222% { background-position: 66.667% 75%; }
  75%     { background-position: 100% 75%; }
  77.7778% { background-position: 0% 87.5%; }
  80.5556% { background-position: 33.333% 87.5%; }
  83.3333% { background-position: 66.667% 87.5%; }
  86.1111% { background-position: 100% 87.5%; }
  88.8889% { background-position: 0% 100%; }
  91.6667% { background-position: 33.333% 100%; }
  94.4444% { background-position: 66.667% 100%; }
  97.2222% { background-position: 100% 100%; }
  100%    { background-position: 0% 0%; }
}

.splash-title {
  margin: 20px 0 0;
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-align: center;
  color: var(--fg);
  opacity: 0;
  transform: translateY(26px);
  animation: title-rise 0.7s var(--ease-standard) 0.55s both;
}
@keyframes title-rise {
  from { opacity: 0; transform: translateY(26px); }
  to { opacity: 1; transform: translateY(0); }
}
.splash-title em { font-style: normal; color: inherit; }
.splash-subtitle {
  display: block;
  margin-top: 4px;
  font-family: var(--font-body);
  font-size: var(--fs-body);
  font-weight: 400;
  color: var(--fg-2);
}

.splash-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  background: var(--border-strong);
}
.splash-progress i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
  animation: progress 2.4s linear 0.15s both;
}
@keyframes progress { from { width: 0; } to { width: 100%; } }
@media (prefers-reduced-motion: reduce) {
  .splash-progress i { animation-duration: 0.9s; }
  body.ready .splash-sprite { animation: none; }
  .splash-title { animation: none; opacity: 1; transform: none; }
}

.splash-skip {
  position: absolute;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  text-align: center;
  font-size: var(--fs-caption);
  color: var(--muted);
  opacity: 0;
  animation: splash-in 0.5s var(--ease-standard) 1s both;
}
</style>
</head>
<body data-od-id="splash">

<main class="splash">
  <div class="splash-plate">
    <div class="splash-sprite" id="sprite" role="img" aria-label="Анимация герба Петровского"></div>
  </div>
  <h1 class="splash-title">Петров<em>ское</em><span class="splash-subtitle">Спортивное поселение</span></h1>
</main>

<div class="splash-progress" aria-hidden="true"><i></i></div>
<div class="splash-skip">Нажмите в любом месте, чтобы продолжить</div>

<script>
(function () {
  var sheet = 'Splash_spriteSheet-9x4.png';
  var gone = false;
  function go() {
    if (gone) return;
    gone = true;
    document.body.classList.add('fade');
    setTimeout(function () { location.href = 'index.html'; }, 420);
  }
  function start() {
    document.body.classList.add('ready');
    setTimeout(go, 2200);
  }
  var img = new Image();
  img.src = sheet;
  if (img.complete) {
    start();
  } else {
    img.onload = start;
    img.onerror = start;
  }
  document.addEventListener('click', go);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') go();
  });
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    start();
    setTimeout(go, 1100);
  }
})();
</script>
</body>
</html>
