<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<title>Петровское СП — Тренировка идёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eaf4ff;
  --surface: #ffffff;
  --surface-2: #eef6ff;
  --surface-warm: #f5faff;

  --fg: #12213b;
  --fg-2: #445269;
  --muted: #78859b;
  --meta: #99a4b7;

  --border: rgba(18,33,59,0.08);
  --border-soft: rgba(18,33,59,0.05);
  --border-strong: rgba(18,33,59,0.16);

  --accent: #1a86e0;
  --accent-on: #ffffff;
  --accent-hover: #2f97f0;
  --accent-active: #1473c9;
  --yellow: #ffc93c;
  --yellow-on: #12213b;

  --success: #2bb066;
  --warn: #ffc93c;
  --danger: #ff4d4d;

  --font-display: "Oswald", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --leading-body: 1.5;
  --tracking-display: 0.01em;
  --tracking-caps: 0.08em;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 980px;

  --elev-raised: 0 16px 36px rgba(18,33,59,0.10);
  --focus-ring: 0 0 0 4px rgba(26,134,224,0.30);

  --motion-fast: 150ms;
  --motion-base: 220ms;
  --ease-standard: cubic-bezier(0.28,0,0.22,1);

  --container-max: 700px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface-warm);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; }
a { color: inherit; }

.app {
  position: relative;
  z-index: 1;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 0 calc(108px + env(safe-area-inset-bottom));
  min-height: 100vh;
}

/* ── Шапка ─────────────────────────────────────────────────────────── */
.hd {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 28px 12px 22px;
}
@media (min-width: 560px) { .hd { padding: 40px 24px 26px; } }
.hd-txt { flex: 1; min-width: 0; }
.hd h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  line-height: 1.3;
  text-transform: uppercase;
  color: var(--fg);
}
.hd .sub { margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.hd-acts { display: flex; gap: 8px; flex: none; }
.icon-btn {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg-2);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.icon-btn::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn svg { width: 22px; height: 22px; }

/* ── Тело ──────────────────────────────────────────────────────────── */
.body { padding: 0 12px; }
@media (min-width: 560px) { .body { padding: 0 24px; } }

/* ── Прогресс-карточка ─────────────────────────────────────────────── */
.progress-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border-left: 3px solid var(--accent);
  padding: 18px 18px 16px;
}
.prog-row { display: flex; align-items: center; gap: 12px; }
.prog-ic {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  color: var(--success);
  background: color-mix(in srgb, var(--success) 16%, var(--surface));
}
.prog-ic svg { width: 20px; height: 20px; }
.prog-txt { flex: 1; min-width: 0; }
.prog-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--meta);
}
.prog-title {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
}
.prog-count { flex: none; font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.prog-bar {
  margin-top: 14px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent);
  width: 0;
  transition: width 0.5s var(--ease-standard);
}
.prog-meta { margin: 8px 0 0; display: flex; justify-content: space-between; font-size: 13px; line-height: 1.4; color: var(--muted); }

/* ── Таймер ────────────────────────────────────────────────────────── */
.timer-card {
  margin-top: 12px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border-left: 3px solid var(--yellow);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.timer {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 36px;
  font-weight: 600;
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}
.timer-chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--success);
  background: color-mix(in srgb, var(--success) 12%, var(--surface));
  border-radius: var(--radius-pill);
  padding: 4px 11px;
}
.timer-chip .dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--success); animation: blink 1.4s var(--ease-standard) infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.timer-pause {
  flex: none;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--fg-2);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.timer-pause:hover { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.timer-pause:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.timer-pause svg { width: 20px; height: 20px; }

/* ── Упражнения ────────────────────────────────────────────────────── */
.sec { margin-top: 32px; }
.sec-head { display: flex; align-items: center; gap: 12px; padding: 0 2px 14px; }
.sec-head h2 {
  margin: 0; flex: 1;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
}
.sec-count { flex: none; font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--meta); font-variant-numeric: tabular-nums; }
.ex-list { display: grid; gap: 10px; }
.ex-card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 0;
  border-radius: var(--radius-md);
  padding: 14px 16px;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard), opacity var(--motion-fast) var(--ease-standard);
  animation: rise 0.5s var(--ease-standard) both;
  animation-delay: calc(var(--i, 0) * 50ms);
}
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .ex-card { animation: none; } }
.ex-card:hover { background: var(--surface-2); }
.ex-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.ex-check {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: transparent;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.ex-check svg { width: 15px; height: 15px; }
.ex-card.is-done .ex-check {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.ex-txt { flex: 1; min-width: 0; }
.ex-name { display: block; font-size: 16px; font-weight: 600; color: var(--fg); transition: color var(--motion-fast) var(--ease-standard); }
.ex-sets { display: block; font-size: 13px; line-height: 1.4; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.ex-card.is-done .ex-name { color: var(--meta); text-decoration: line-through; text-decoration-color: var(--border-strong); }

/* ── Кнопка завершения ─────────────────────────────────────────────── */
.finish {
  margin-top: 24px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: var(--accent-on);
  font-size: 16px;
  font-weight: 700;
  padding: 14px;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.finish:hover { background: var(--accent-hover); }
.finish:active { background: var(--accent-active); }
.finish:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.finish.is-ready { background: var(--success); }
.finish.is-ready:hover { background: color-mix(in srgb, var(--success) 88%, var(--bg)); }

/* ── Шит меню ──────────────────────────────────────────────────────── */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  transition: opacity var(--motion-base) var(--ease-standard);
  z-index: 40;
  pointer-events: none;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%) translateY(105%);
  transition: transform var(--motion-base) var(--ease-standard);
  width: 100%;
  max-width: var(--container-max);
  background: var(--surface-warm);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  border: 1px solid var(--border);
  border-bottom: 0;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  z-index: 50;
}
.sheet.open { transform: translateX(-50%) translateY(0); }
@media (min-width: 560px) { .sheet { bottom: 24px; border-radius: var(--radius-lg); border-bottom: 1px solid var(--border); box-shadow: var(--elev-raised); } }
.sheet-grab { width: 40px; height: 5px; border-radius: var(--radius-pill); background: var(--border-strong); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 8px; }
.sheet-title { margin: 0; flex: 1; min-width: 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; }
.sheet-list { display: grid; gap: 2px; max-height: 46vh; overflow: auto; }
.sheet-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  border-radius: var(--radius-md);
  padding: 10px 8px;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.sheet-item:hover { background: var(--surface-2); }
.sheet-item:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sheet-item.is-danger { color: var(--danger); }
.sheet-ic {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 16%, var(--surface-warm));
}
.sheet-item.is-danger .sheet-ic { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface-warm)); }
.sheet-ic svg { width: 18px; height: 18px; }
.sheet-il { font-size: 16px; font-weight: 500; color: var(--fg); }
.sheet-item.is-danger .sheet-il { color: var(--danger); }
.sheet-cancel {
  margin-top: 8px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--surface-2);
  color: var(--fg-2);
  font-size: 16px;
  font-weight: 600;
  padding: 13px;
  cursor: pointer;
}
.sheet-cancel:hover { background: var(--surface); }
.sheet-cancel:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ── Тост ──────────────────────────────────────────────────────────── */
.toast-wrap {
  position: fixed;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  z-index: 70;
  width: max-content;
  max-width: calc(100vw - 40px);
}
.toast {
  background: var(--fg);
  color: var(--bg);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.35;
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  box-shadow: var(--elev-raised);
  animation: toast-in 0.3s var(--ease-standard) both;
}
.toast.hide { animation: toast-out 0.25s var(--ease-standard) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
body.no-scroll { overflow: hidden; }
</style>
</head>
<body data-od-id="training-active">

<svg style="display:none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></symbol>
  <symbol id="ic-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
  <symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-trend" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 6-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 7H19v3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="hd" data-od-id="trn-active-header">
    <div class="hd-txt">
      <h1 id="title"></h1>
      <p class="sub" id="meta"></p>
    </div>
    <div class="hd-acts">
      <button type="button" class="icon-btn" id="menu-btn" aria-label="Меню тренировки"><svg aria-hidden="true"><use href="#ic-dots"/></svg></button>
    </div>
  </header>

  <main class="body">
    <section class="progress-card" data-od-id="trn-progress">
      <div class="prog-row">
        <span class="prog-ic" aria-hidden="true"><svg><use href="#ic-trend"/></svg></span>
        <div class="prog-txt">
          <div class="prog-label">Прогресс</div>
          <div class="prog-title" id="prog-label"></div>
        </div>
        <span class="prog-count" id="prog-count"></span>
      </div>
      <div class="prog-bar" role="progressbar" aria-label="Прогресс тренировки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-meta">
        <span id="prog-note"></span>
        <span id="started-at"></span>
      </div>
    </section>

    <section class="timer-card" data-od-id="trn-timer">
      <span class="timer-chip"><span class="dot" aria-hidden="true"></span>Идёт</span>
      <span class="timer" id="timer">00:00</span>
      <button type="button" class="timer-pause" id="timer-toggle" aria-label="Пауза/продолжить"><svg aria-hidden="true"><use href="#ic-pause"/></svg></button>
    </section>

    <section class="sec" data-od-id="trn-exercises">
      <div class="sec-head">
        <h2>Упражнения</h2>
        <span class="sec-count" id="ex-count"></span>
      </div>
      <div class="ex-list" id="ex-list"></div>
    </section>

    <button type="button" class="finish" id="finish" data-od-id="trn-finish">Завершить тренировку</button>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="menu-sheet" role="dialog" aria-modal="true" aria-label="Меню тренировки">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <h3 class="sheet-title">Тренировка</h3>
  </div>
  <div class="sheet-list">
    <button type="button" class="sheet-item" id="sheet-pause"><span class="sheet-ic"><svg><use href="#ic-pause"/></svg></span><span class="sheet-il" id="sheet-pause-label">Поставить на паузу</span></button>
    <button type="button" class="sheet-item" id="sheet-clear"><span class="sheet-ic"><svg><use href="#ic-check"/></svg></span><span class="sheet-il">Сбросить отметки</span></button>
    <button type="button" class="sheet-item is-danger" id="sheet-quit"><span class="sheet-ic"><svg><use href="#ic-x"/></svg></span><span class="sheet-il">Завершить без сохранения</span></button>
  </div>
  <button type="button" class="sheet-cancel" id="sheet-cancel">Отмена</button>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var LS_ACTIVE = 'trn:active';
  var LS_LOGS = 'trn:logs';
  var LS_REPORT = 'trn:report';

  var DEFAULT_PLAN = {
    id: 'plan-sila',
    title: 'Силовая тренировка',
    date: 'Сегодня',
    time: '18:00 – 19:30',
    place: 'Тренажёрный зал',
    exercises: [
      { name: 'Жим штанги лёжа', sets: '4 × 8 · 40 кг' },
      { name: 'Приседания со штангой', sets: '4 × 10 · 50 кг' },
      { name: 'Тяга верхнего блока', sets: '3 × 12 · 30 кг' },
      { name: 'Подъём на бицепс стоя', sets: '3 × 12 · 12 кг' },
      { name: 'Скручивания на пресс', sets: '3 × 20' }
    ]
  };

  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* noop */ } }
  function byId(id) { return document.getElementById(id); }

  function toast(msg) {
    var wrap = byId('toasts');
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.classList.add('hide');
      setTimeout(function () { t.remove(); }, 260);
    }, 2200);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtDur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) {
      return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
    }
    return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
  }

  function fmtClock(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var m = d.getMinutes();
    return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
  }

  var active = null;
  try {
    var raw = lsGet(LS_ACTIVE);
    if (raw) active = JSON.parse(raw);
  } catch (e) { /* ignore */ }

  if (!active || !active.exercises || !active.exercises.length) {
    active = {
      planId: DEFAULT_PLAN.id,
      title: DEFAULT_PLAN.title,
      time: DEFAULT_PLAN.time,
      place: DEFAULT_PLAN.place,
      dateLabel: DEFAULT_PLAN.date,
      startTs: Date.now(),
      exercises: DEFAULT_PLAN.exercises.map(function (ex) {
        return { name: ex.name, sets: ex.sets, done: false };
      })
    };
    lsSet(LS_ACTIVE, JSON.stringify(active));
  }

  var paused = false;
  var elapsedMs = 0;
  var timer = null;

  function now() {
    return Date.now();
  }

  function elapsed() {
    return paused ? elapsedMs : (now() - active.startTs);
  }

  function renderTimer() {
    byId('timer').textContent = fmtDur(elapsed());
  }

  function tick() {
    renderTimer();
  }

  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 1000);
    tick();
  }

  function pauseT() {
    if (paused) return;
    elapsedMs = elapsed();
    paused = true;
    byId('timer-toggle').innerHTML = '<svg aria-hidden="true"><use href="#ic-play"/></svg>';
    byId('sheet-pause-label').textContent = 'Продолжить';
    renderTimer();
  }

  function resumeT() {
    if (!paused) return;
    active.startTs = now() - elapsedMs;
    paused = false;
    byId('timer-toggle').innerHTML = '<svg aria-hidden="true"><use href="#ic-pause"/></svg>';
    byId('sheet-pause-label').textContent = 'Поставить на паузу';
    lsSet(LS_ACTIVE, JSON.stringify(active));
    renderTimer();
  }

  function doneCount() {
    var n = 0;
    active.exercises.forEach(function (ex) { if (ex.done) n++; });
    return n;
  }

  function pct() {
    return active.exercises.length ? Math.round(doneCount() / active.exercises.length * 100) : 0;
  }

  function render() {
    var total = active.exercises.length;
    var done = doneCount();
    byId('title').textContent = active.title;
    byId('meta').textContent = active.dateLabel + ' · ' + (active.time || '') + (active.place ? ' · ' + active.place : '');
    byId('prog-count').textContent = done + ' из ' + total;
    byId('ex-count').textContent = done + ' / ' + total;
    byId('prog-label').textContent = done === total ? 'Тренировка выполнена' : (total - done) + ' упражнений осталось';
    byId('prog-note').textContent = done === total
      ? 'Все упражнения отмечены — можно завершать'
      : 'Отмечайте выполненные упражнения';
    byId('started-at').textContent = 'Начато в ' + fmtClock(active.startTs);
    var fill = byId('prog-fill');
    fill.style.width = pct() + '%';
    fill.setAttribute('aria-valuenow', pct());
    var finish = byId('finish');
    finish.classList.toggle('is-ready', done === total);
    finish.textContent = done === total ? 'Завершить и показать отчёт' : 'Завершить тренировку';

    var list = byId('ex-list');
    list.innerHTML = '';
    active.exercises.forEach(function (ex, i) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'ex-card' + (ex.done ? ' is-done' : '');
      card.style.setProperty('--i', i);
      card.setAttribute('data-ex', i);
      card.setAttribute('aria-pressed', ex.done ? 'true' : 'false');
      card.innerHTML =
        '<span class="ex-check"><svg aria-hidden="true"><use href="#ic-check"/></svg></span>' +
        '<span class="ex-txt">' +
        '<span class="ex-name">' + esc(ex.name) + '</span>' +
        '<span class="ex-sets">' + esc(ex.sets || '') + '</span>' +
        '</span>';
      list.appendChild(card);
    });
  }

  function saveActive() { lsSet(LS_ACTIVE, JSON.stringify(active)); }

  function toggleEx(i) {
    var ex = active.exercises[i];
    if (!ex) return;
    ex.done = !ex.done;
    saveActive();
    render();
  }

  function clearMarks() {
    active.exercises.forEach(function (ex) { ex.done = false; });
    saveActive();
    render();
    toast('Отметки сброшены');
    closeSheet();
  }

  function finish() {
    clearInterval(timer);
    var durMs = elapsed();
    var done = doneCount();
    var total = active.exercises.length;
    var report = {
      title: active.title,
      date: active.dateLabel,
      time: active.time,
      place: active.place,
      startTs: active.startTs,
      durSec: Math.round(durMs / 1000),
      done: done,
      total: total,
      exercises: active.exercises.map(function (ex) {
        return { name: ex.name, sets: ex.sets, done: ex.done };
      })
    };
    var log = {
      id: 'log-' + Date.now(),
      title: active.title,
      date: active.dateLabel,
      time: active.time,
      place: active.place,
      done: done,
      total: total,
      dur: Math.round(durMs / 1000 / 60),
      status: done === total ? 'done' : 'partial',
      exercises: report.exercises
    };
    lsSet(LS_REPORT, JSON.stringify(report));

    var logs = [];
    try {
      var rawLogs = lsGet(LS_LOGS);
      if (rawLogs) logs = JSON.parse(rawLogs);
    } catch (e) { /* ignore */ }
    logs.unshift(log);
    lsSet(LS_LOGS, JSON.stringify(logs));
    lsSet(LS_ACTIVE, JSON.stringify(active));

    location.href = 'training-report.html';
  }

  function quit() {
    clearInterval(timer);
    lsSet(LS_ACTIVE, '');
    location.href = 'trainings.html';
  }

  var scrim = byId('scrim');
  var sheet = byId('menu-sheet');

  function openSheet() {
    scrim.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet() {
    scrim.classList.remove('open');
    sheet.classList.remove('open');
  }

  byId('menu-btn').addEventListener('click', openSheet);
  byId('sheet-cancel').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  byId('sheet-pause').addEventListener('click', function () {
    if (paused) resumeT(); else pauseT();
    closeSheet();
  });
  byId('sheet-clear').addEventListener('click', clearMarks);
  byId('sheet-quit').addEventListener('click', function () {
    closeSheet();
    quit();
  });

  byId('ex-list').addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('[data-ex]') : null;
    if (card) toggleEx(parseInt(card.getAttribute('data-ex'), 10));
  });

  byId('timer-toggle').addEventListener('click', function () {
    if (paused) resumeT(); else pauseT();
  });

  byId('finish').addEventListener('click', finish);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (sheet.classList.contains('open')) closeSheet();
  });

  startTimer();
  render();
})();
</script>
</body>
</html>
