<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a86e0">
<title>Сплэш-экран в фрейме телефона · Петровское СП</title>
<link rel="preload" as="image" href="Gerb_Camera_00015_00015-0.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #1a86e0;
  --yellow: #ffc93c;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: #22364d;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(90% 60% at 50% 0%, #ffffff 0%, rgba(255, 255, 255, 0) 60%),
    linear-gradient(180deg, #e9eef5 0%, #dbe3ec 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 16px 40px;
}

.stage { display: flex; flex-direction: column; align-items: center; gap: 22px; }

/* ── Фрейм телефона ────────────────────────────────────────────────── */
.phone {
  position: relative;
  width: 340px;
  height: 740px;
  border-radius: 58px;
  padding: 12px;
  background: linear-gradient(180deg, #1c232c 0%, #10141a 70%, #1c232c 100%);
  box-shadow:
    0 0 0 2px rgba(0, 0, 0, 0.35),
    0 30px 70px rgba(15, 35, 60, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
}
.phone::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 26px;
  transform: translateX(-50%);
  width: 96px;
  height: 26px;
  border-radius: 13px;
  background: #05070a;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.04);
  z-index: 3;
}
.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 46px;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% -12%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 55%),
    linear-gradient(165deg, #2f9df0 0%, var(--accent) 50%, #1163a8 100%);
}

/* ── Содержимое сплэша ────────────────────────────────────────────── */
.sp {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 48px;
  opacity: 0;
  animation: sp-in 0.4s var(--ease-standard) 0.05s both;
}
@keyframes sp-in { from { opacity: 0; } to { opacity: 1; } }

.sp-plate {
  position: relative;
  width: 184px;
  height: 184px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 35% 30%, #ffd96e 0%, var(--yellow) 55%, #f0a52e 100%);
  transform: scale(0.2);
  opacity: 0;
}
body.ready .sp-plate {
  animation: plate-grow 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both;
}
@keyframes plate-grow {
  from { transform: scale(0.2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.sp-sprite {
  flex: 0 0 auto;
  width: 208px;
  height: 208px;
  background-image: url("Gerb_Camera_00015_00015-0.png");
  background-repeat: no-repeat;
  background-size: 400% 500%;
  background-position: 0% 0%;
  opacity: 0;
  transition: opacity 0.4s var(--ease-standard);
}
body.ready .sp-sprite {
  opacity: 1;
  animation: splash-sprite 1s steps(1, end) infinite;
}

@keyframes splash-sprite {
  0%   { background-position: 0% 0%; }
  5%   { background-position: 33.333% 0%; }
  10%  { background-position: 66.667% 0%; }
  15%  { background-position: 100% 0%; }
  20%  { background-position: 0% 25%; }
  25%  { background-position: 33.333% 25%; }
  30%  { background-position: 66.667% 25%; }
  35%  { background-position: 100% 25%; }
  40%  { background-position: 0% 50%; }
  45%  { background-position: 33.333% 50%; }
  50%  { background-position: 66.667% 50%; }
  55%  { background-position: 100% 50%; }
  60%  { background-position: 0% 75%; }
  65%  { background-position: 33.333% 75%; }
  70%  { background-position: 66.667% 75%; }
  75%  { background-position: 100% 75%; }
  80%  { background-position: 0% 100%; }
  85%  { background-position: 33.333% 100%; }
  90%  { background-position: 66.667% 100%; }
  95%  { background-position: 100% 100%; }
  100% { background-position: 0% 0%; }
}

.sp-title {
  margin: 18px 0 0;
  font-family: var(--font-body);
  font-size: 26px;
  font-weight: 500;
  text-align: center;
  color: #ffffff;
  text-shadow: 0 2px 14px rgba(7, 45, 88, 0.3);
  opacity: 0;
  transform: translateY(22px);
  animation: title-rise 0.7s var(--ease-standard) 0.55s both;
}
@keyframes title-rise {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: translateY(0); }
}
.sp-title em { font-style: normal; color: #ffffff; }
.sp-subtitle {
  display: block;
  margin-top: 4px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 400;
  color: #ffffff;
}

.sp-progress {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 14px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.25);
}
.sp-progress i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--yellow), #ffe69a);
  border-radius: 2px;
  animation: progress 1.8s linear infinite;
}
@keyframes progress { from { width: 0; } to { width: 100%; } }

.sp-skip {
  position: absolute;
  bottom: 26px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.75);
}

/* ── Подпись под фреймом ───────────────────────────────────────────── */
.stage-title {
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #16324f;
}
.stage-sub { margin-top: 4px; font-size: 13px; color: #5b7899; }
.stage-btn {
  margin-top: 14px;
  padding: 9px 18px;
  border: 1px solid rgba(26, 134, 224, 0.35);
  border-radius: 980px;
  background: #ffffff;
  color: var(--accent);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s var(--ease-standard);
}
.stage-btn:hover { background: #eef6ff; }

@media (prefers-reduced-motion: reduce) {
  body.ready .sp-sprite { animation: none; }
  .sp-progress i { animation-duration: 0.9s; }
  .sp-title { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body data-od-id="splash-phone">

<div class="stage">
  <div class="phone">
    <div class="phone-screen">
      <div class="sp">
        <div class="sp-plate">
          <div class="sp-sprite" id="sprite" role="img" aria-label="Анимация герба Петровского"></div>
        </div>
        <h1 class="sp-title">Петров<em>ское</em><span class="sp-subtitle">Спортивное поселение</span></h1>
        <div class="sp-progress" aria-hidden="true"><i></i></div>
        <div class="sp-skip">Нажмите, чтобы продолжить</div>
      </div>
    </div>
  </div>
  <div class="stage-title">Сплэш-экран · Петровское СП</div>
  <div class="stage-sub">Анимация герба · спрайт 4×5 · фон — фирменный синий #1a86e0</div>
  <button class="stage-btn" id="replay" type="button">Переиграть анимацию</button>
</div>

<script>
(function () {
  var img = new Image();
  img.src = 'Gerb_Camera_00015_00015-0.png';
  function ready() { document.body.classList.add('ready'); }
  if (img.complete) ready();
  else { img.onload = ready; img.onerror = ready; }

  function restart(el) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
  document.getElementById('replay').addEventListener('click', function () {
    restart(document.getElementById('sprite'));
    restart(document.querySelector('.sp-plate'));
    restart(document.querySelector('.sp-title'));
  });
})();
</script>
</body>
</html>
