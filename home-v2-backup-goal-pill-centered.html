.mine-card { width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); box-shadow: var(--elev-raised); padding: var(--space-6) var(--space-5) var(--space-5); text-align: center; }
.mine-ava { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent); font-size: var(--fs-title); font-weight: 700; }
.mine-name { display: block; margin-top: var(--space-3); font-family: var(--font-display); font-size: var(--fs-title); font-weight: 700; letter-spacing: var(--tracking-display); color: var(--fg); }
.mine-role { display: block; margin-top: var(--space-1); font-size: var(--fs-meta); color: var(--muted); }
.mine-qr { width: 188px; height: 188px; margin: var(--space-5) auto 0; padding: var(--space-3); border: 1px solid var(--border-soft); border-radius: var(--radius-md); background: var(--surface-warm); display: grid; place-items: center; }
.mine-qr svg { width: 100%; height: 100%; display: block; color: var(--fg); }
.mine-id { display: inline-block; margin-top: var(--space-3); font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0.05em; color: var(--meta); background: var(--surface); border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); }
.mine-hint { margin: var(--space-3) 0 0; font-size: var(--fs-meta); line-height: 1.45; color: var(--muted); }
.mine-btns { display: flex; gap: var(--space-3); margin-top: var(--space-5); }

.gto-hero { margin: var(--space-2) var(--space-4) 0; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); box-shadow: var(--elev-raised); padding: var(--space-5); animation: rise 0.4s var(--ease-standard) both; }
.gto-hero-top { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.gto-chip { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--fs-meta); font-weight: 600; color: var(--fg-2); background: var(--surface-2); border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); }
.gto-chip.is-sign { color: color-mix(in oklab, var(--c), var(--fg) 30%); background: color-mix(in srgb, var(--c) 15%, var(--surface)); }
.gto-chip .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.gto-signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-4); }
.sign { border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-3) var(--space-2); text-align: center; cursor: pointer; background: var(--surface-warm); transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
.sign.is-target { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.sign.is-off { opacity: 0.55; }
.sign .sign-dot { width: 22px; height: 22px; margin: 0 auto var(--space-2); border-radius: 50%; background: var(--c); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.14); }
.sign .sign-name { display: block; font-size: var(--fs-meta); font-weight: 700; letter-spacing: -0.01em; }
.sign .sign-state { display: block; margin-top: var(--space-1); font-size: var(--fs-caption); line-height: 1.3; color: var(--muted); }
.gto-track { margin-top: var(--space-5); height: 8px; border-radius: var(--radius-pill); background: var(--surface-2); overflow: hidden; }
.gto-fill { height: 100%; width: 0; border-radius: var(--radius-pill); background: linear-gradient(90deg, var(--gto-bronze), var(--gto-gold)); transition: width 0.6s var(--ease-standard); }
.gto-progress-label { display: flex; align-items: baseline; gap: var(--space-2); margin: var(--space-2) 0 0; font-size: var(--fs-meta); line-height: 1.4; color: var(--muted); }
.gto-progress-label b { font-size: var(--fs-body); font-weight: 700; color: var(--fg); letter-spacing: -0.01em; }
.norm { margin: var(--space-6) var(--space-4) 0; }
.norm-head { display: flex; align-items: baseline; gap: var(--space-3); padding: 0 var(--space-1) var(--space-3); }
